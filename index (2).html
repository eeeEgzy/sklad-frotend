<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Склад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#171717);--hint:var(--tg-theme-hint-color,#888);--link:var(--tg-theme-link-color,#2481cc);--button:var(--tg-theme-button-color,#2481cc);--button-text:var(--tg-theme-button-text-color,#fff);--secondary:var(--tg-theme-secondary-bg-color,#f1f1f1);--danger:#d94b45;--ok:#16865b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#app{padding:12px 14px 40px;max-width:680px;margin:auto}h1{font-size:21px;margin:7px 0 14px}h2{font-size:17px;margin:18px 0 9px}.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{font-size:24px;color:var(--link);cursor:pointer}.card,.menu-btn{background:var(--secondary);border:0;border-radius:12px;padding:13px 14px;margin-bottom:8px;color:var(--text)}.card{display:flex;align-items:center;justify-content:space-between;gap:10px}.card.click{cursor:pointer}.card-main{min-width:0;flex:1}.title{font-size:15px;font-weight:600}.sub,.hint{font-size:12px;color:var(--hint);margin-top:3px}.menu-btn{display:block;width:100%;text-align:left;font-size:15px;cursor:pointer}.btn{background:var(--button);color:var(--button-text);border:0;border-radius:10px;padding:10px 15px;font-size:14px;cursor:pointer}.btn.secondary{background:var(--secondary);color:var(--text)}.btn.danger{background:var(--danger);color:#fff}.btn:disabled{opacity:.45}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.spread{justify-content:space-between}.qty{font-weight:700;font-size:15px;background:var(--bg);padding:5px 10px;border-radius:9px;white-space:nowrap}.low{color:var(--danger)}input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--hint);background:var(--bg);color:var(--text);font-size:15px;margin:5px 0 10px}textarea{min-height:72px;resize:vertical}.form{background:var(--secondary);padding:13px;border-radius:12px;margin:12px 0}.form label{font-size:13px;color:var(--hint)}.center{text-align:center;padding:35px 8px;color:var(--hint)}.pill{font-size:11px;background:var(--bg);border-radius:8px;padding:3px 7px;color:var(--hint)}.history{font-size:12px;padding:9px 0;border-top:1px solid var(--secondary);color:var(--hint)}.empty{color:var(--hint);text-align:center;padding:24px 8px}.video{width:100%;border-radius:12px;background:#111;margin:8px 0}.qr{max-width:220px;width:100%;display:block;margin:12px auto;background:#fff;padding:8px;border-radius:8px}.muted{color:var(--hint)}
</style>
</head>
<body><div id="app"><div class="center">Підключення до складу…</div></div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const API_BASE = window.SKLAD_API_BASE || 'https://valetnyn.pythonanywhere.com';
const initData = tg ? (tg.initData || '') : '';
const app = document.getElementById('app');
let ME = null;
let lastRouteName = 'menu', lastRouteArgs = [];
const routes = {};
const isAdmin = () => ME && ME.role === 'admin';
const canEdit = () => ME && ['admin','editor'].includes(ME.role);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = s => encodeURIComponent(s);
function render(html){app.innerHTML=html;}
function topbar(title, back='menu'){const action=back==='previous'?'rerun()':`go('${back}')`;return `<div class="topbar">${back?`<span class="back" onclick="${action}">←</span>`:''}<h1>${esc(title)}</h1></div>`;}
function toast(msg){if(tg&&tg.showAlert)tg.showAlert(String(msg));else alert(String(msg));}
async function api(path,{method='GET',body}={}){
  const response=await fetch(API_BASE+path,{method,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body===undefined?undefined:JSON.stringify(body)});
  if(!response.ok){let message=`Помилка ${response.status}`;try{const data=await response.json();message=data.detail||message;}catch(_e){}throw new Error(message);}
  const type=response.headers.get('content-type')||'';return type.includes('application/json')?response.json():response;
}
function route(name,fn){routes[name]=fn;}
async function go(name,...args){try{if(!['scan','item','box'].includes(name)){lastRouteName=name;lastRouteArgs=args;}await routes[name](...args);}catch(e){toast(e.message||e);}}
function rerun(){go(lastRouteName,...lastRouteArgs);}
function itemCard(item,open=true){return `<div class="card ${open?'click':''}" ${open?`onclick="go('item',${item.id})"`:''}><div class="card-main"><div class="title">${esc(item.name)}</div><div class="sub">${esc(item.category||'')}</div></div><span class="qty ${item.quantity<=4?'low':''}">${item.quantity} шт.</span></div>`;}
function formField(label,id,type='text',placeholder=''){return `<label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" ${type==='number'?'min="0"':''}>`;}

route('menu',async()=>{
  render(`${topbar('📦 Склад',null)}<div class="hint">${esc(ME.username)} · ${ME.role==='admin'?'Адміністратор':ME.role==='editor'?'Редактор':'Працівник'}</div>
  <button class="menu-btn" onclick="go('categories')">📦 Товари та категорії</button>
  <button class="menu-btn" onclick="go('search')">🔍 Пошук товару</button>
  <button class="menu-btn" onclick="go('deficit')">⚠️ Дефіцит і малі залишки</button>
  <button class="menu-btn" onclick="go('boxes')">🧰 Бокси</button>
  <button class="menu-btn" onclick="go('scan')">📷 Сканувати QR боксу</button>
  ${isAdmin()?'<button class="menu-btn" onclick="go(\'admin\')">⚙️ Адмінка</button>':''}
  ${ME.status==='pending'?'<p class="hint">Ваш акаунт очікує підтвердження адміністратора.</p>':''}`);
});

route('categories',async()=>{
  render(topbar('Категорії')+'<div class="center">Завантаження…</div>');
  const cats=await api('/api/categories');
  render(topbar('📦 Категорії')+(cats.length?cats.map(c=>`<div class="card click" onclick="go('items',${JSON.stringify(c).replace(/"/g,'&quot;')})"><span class="title">${esc(c)}</span><span>›</span></div>`).join(''):'<div class="empty">Категорій поки немає</div>')+
  (canEdit()?`<div class="form"><h2>Додати категорію</h2>${formField('Назва категорії','newcat')}<button class="btn" onclick="createCategory()">＋ Створити категорію</button></div>`:''));
});
async function createCategory(){const input=document.getElementById('newcat');const name=input?input.value.trim():'';if(!name)return toast('Введи назву категорії');try{await api('/api/categories',{method:'POST',body:{name}});toast('Категорію створено');go('categories');}catch(e){toast(e.message);}}

route('items',async(category)=>{
  render(topbar(category,'categories')+'<div class="center">Завантаження товарів…</div>');
  const items=await api('/api/items?category='+enc(category));
  render(topbar(category,'categories')+(items.length?items.map(i=>itemCard(i)).join(''):'<div class="empty">У цій категорії товарів поки немає</div>')+
  (canEdit()?`<div class="form"><h2>Додати товар</h2>${formField('Назва товару','newitem')} ${formField('Початкова кількість','newqty','number','0')}<button class="btn" onclick="createItem(${JSON.stringify(category).replace(/"/g,'&quot;')})">＋ Додати товар</button></div>`:''));
});
async function createItem(category){const name=document.getElementById('newitem').value.trim();const quantity=Number(document.getElementById('newqty').value||0);if(!name)return toast('Введи назву товару');if(!Number.isInteger(quantity)||quantity<0)return toast('Кількість має бути цілим невід’ємним числом');try{await api('/api/items',{method:'POST',body:{name,quantity,category}});toast('Товар додано');go('items',category);}catch(e){toast(e.message);}}

route('item',async(id)=>{
  render(topbar('Товар','categories')+'<div class="center">Завантаження…</div>');
  const item=await api('/api/items/'+id);
  const history=item.history||[];
  render(topbar(item.name,'previous')+`<div class="card"><div class="card-main"><div class="title">${esc(item.name)}</div><div class="sub">${esc(item.category)}</div></div><span class="qty ${item.quantity<=4?'low':''}">${item.quantity} шт.</span></div>
  <div class="row" style="margin:12px 0">${canEdit()?`<button class="btn" onclick="changeItemQty(${id},1)">＋ Поповнити</button>`:''}<button class="btn danger" onclick="changeItemQty(${id},-1)">− Списати</button></div>
  <h2>Історія руху</h2>${history.length?history.map(h=>`<div class="history"><b>${h.action==='inc'?'Надходження':'Списання'}: ${h.qty} шт.</b> · ${esc(h.username||'')}<br>${esc(h.date||'')} ${h.box_id?`· Бокс №${h.box_id}`:''}<br>${esc(h.reason||'')}</div>`).join(''):'<div class="empty">Історії поки немає</div>'}`);
});
async function changeItemQty(id,sign){let amount=1;if(sign<0){const raw=prompt('Скільки списати?', '1');if(raw===null)return;amount=Number(raw);if(!Number.isInteger(amount)||amount<1)return toast('Вкажи ціле число більше нуля');}else{const raw=prompt('Скільки додати?', '1');if(raw===null)return;amount=Number(raw);if(!Number.isInteger(amount)||amount<1)return toast('Вкажи ціле число більше нуля');}
  let reason='';if(sign<0){reason=prompt('Причина списання (обов’язково):','Використано у виробництві')||'';if(!reason.trim())return toast('Причина списання обов’язкова');}
  try{await api(`/api/items/${id}/qty`,{method:'POST',body:{delta:sign*amount,reason}});toast('Залишок оновлено');go('item',id);}catch(e){toast(e.message);}}

route('search',async()=>{render(topbar('Пошук')+`<input id="q" placeholder="Назва або частина назви" oninput="searchNow()"><div id="results" class="hint">Почни вводити назву товару</div>`);});
let searchTimer=null;
function searchNow(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{const q=document.getElementById('q')?.value.trim();const out=document.getElementById('results');if(!out)return;if(!q){out.textContent='Почни вводити назву товару';return;}try{const rows=await api('/api/search?q='+enc(q));out.innerHTML=rows.length?rows.map(i=>itemCard(i)).join(''):'<div class="empty">Нічого не знайдено</div>';}catch(e){out.textContent=e.message;}},250);}

route('deficit',async()=>{render(topbar('Дефіцит')+'<div class="center">Завантаження…</div>');const rows=await api('/api/deficit?threshold=4');render(topbar('⚠️ Дефіцит')+'<p class="hint">Показані товари із залишком 4 шт. або менше.</p>'+(rows.length?rows.map(i=>itemCard(i)).join(''):'<div class="empty">Товарів із критично малим залишком немає</div>'));});

route('boxes',async()=>{render(topbar('Бокси')+'<div class="center">Завантаження…</div>');const boxes=await api('/api/boxes');render(topbar('🧰 Бокси')+(boxes.length?boxes.map(b=>`<div class="card click" onclick="go('box',${b.id})"><div class="card-main"><div class="title">${esc(b.name)}</div><div class="sub">Товарів: ${b.item_count}</div></div><span>›</span></div>`).join(''):'<div class="empty">Боксів поки немає</div>')+(canEdit()?`<div class="form"><h2>Створити бокс</h2>${formField('Назва боксу','boxname')}<button class="btn" onclick="createBox()">＋ Створити</button></div>`:''));});
async function createBox(){const name=document.getElementById('boxname').value.trim();if(!name)return toast('Введи назву боксу');try{await api('/api/boxes',{method:'POST',body:{name}});go('boxes');}catch(e){toast(e.message);}}

route('box',async(id)=>{render(topbar('Бокс','boxes')+'<div class="center">Завантаження…</div>');const box=await api('/api/boxes/'+id);render(topbar('🧰 '+box.name,'boxes')+`<div class="row"><button class="btn secondary" onclick="showBoxQR(${id})">Показати QR</button></div><div id="qrholder"></div><h2>Товари в боксі</h2>`+(box.items.length?box.items.map(i=>`<div class="card"><div class="card-main"><div class="title">${esc(i.name)}</div><div class="sub">${esc(i.category)} · На складі загалом: ${i.total_quantity}</div></div><span class="qty">${i.quantity} шт.</span></div><div class="row" style="margin:-3px 0 12px"><button class="btn danger" onclick="changeBoxQty(${id},${i.item_id},-1)">− Списати</button>${canEdit()?`<button class="btn" onclick="changeBoxQty(${id},${i.item_id},1)">＋ Поповнити</button><button class="btn secondary" onclick="removeBoxItem(${id},${i.item_id})">Прибрати з боксу</button>`:''}</div>`).join(''):'<div class="empty">У боксі поки немає товарів</div>')+(canEdit()?`<div class="form"><h2>Додати товар у бокс</h2><label>Товар</label><select id="boxitem"><option value="">Завантаження…</option></select>${formField('Кількість для розміщення','boxqty','number','1')}<button class="btn" onclick="addBoxItem(${id})">＋ Додати в бокс</button></div>`:''));if(canEdit())loadBoxItemOptions();});
async function loadBoxItemOptions(){try{const items=await api('/api/items');const select=document.getElementById('boxitem');if(select)select.innerHTML='<option value="">Оберіть товар</option>'+items.map(i=>`<option value="${i.id}">${esc(i.name)} · доступно ${i.quantity}</option>`).join('');}catch(e){toast(e.message);}}
async function addBoxItem(boxId){const item_id=Number(document.getElementById('boxitem').value);const quantity=Number(document.getElementById('boxqty').value);if(!item_id||!Number.isInteger(quantity)||quantity<1)return toast('Оберіть товар і вкажіть кількість');try{await api(`/api/boxes/${boxId}/items`,{method:'POST',body:{item_id,quantity}});go('box',boxId);}catch(e){toast(e.message);}}
async function removeBoxItem(boxId,itemId){if(!confirm('Прибрати цей товар із боксу? Загальний складський залишок не зміниться.'))return;try{await api(`/api/boxes/${boxId}/items/${itemId}`,{method:'DELETE'});go('box',boxId);}catch(e){toast(e.message);}}
async function changeBoxQty(boxId,itemId,sign){const raw=prompt(sign<0?'Скільки списати з боксу?':'Скільки додати в бокс?','1');if(raw===null)return;const amount=Number(raw);if(!Number.isInteger(amount)||amount<1)return toast('Вкажи ціле число більше нуля');let reason='';if(sign<0){reason=prompt('Причина списання (обов’язково):','Використано у виробництві')||'';if(!reason.trim())return toast('Причина списання обов’язкова');}try{await api(`/api/boxes/${boxId}/items/${itemId}/qty`,{method:'POST',body:{delta:sign*amount,reason}});toast('Залишок боксу оновлено');go('box',boxId);}catch(e){toast(e.message);}}
async function showBoxQR(id){try{const response=await fetch(API_BASE+`/api/boxes/${id}/qr`,{headers:{'X-Telegram-Init-Data':initData}});if(!response.ok)throw new Error('Не вдалося отримати QR-код');const blob=await response.blob();const url=URL.createObjectURL(blob);const holder=document.getElementById('qrholder');if(holder)holder.innerHTML=`<img class="qr" src="${url}" alt="QR боксу"><p class="hint center">QR-код боксу №${id}</p>`;}catch(e){toast(e.message);}}

let cameraStream=null, scanLoop=false;
route('scan',async()=>{render(topbar('Сканер QR','menu')+`<p class="hint">Наведи камеру на QR-код боксу. Якщо камера недоступна, введи код вручну (наприклад: box_12).</p><video id="camera" class="video" autoplay playsinline></video><div class="row"><button class="btn" onclick="startScanner()">Увімкнути камеру</button><button class="btn secondary" onclick="stopScanner()">Зупинити</button></div><div class="form"><label>Код боксу</label><input id="manualqr" placeholder="box_12"><button class="btn" onclick="openScannedCode()">Відкрити бокс</button></div><div id="scanstatus" class="hint"></div>`);});
async function startScanner(){
  // У Telegram на iPhone використовуємо вбудований сканер — BarcodeDetector там може бути відсутній.
  if(tg && typeof tg.showScanQrPopup==='function'){
    try{tg.showScanQrPopup({text:'Наведіть камеру на QR-код боксу'},(text)=>{const field=document.getElementById('manualqr');if(field)field.value=text;tg.closeScanQrPopup();openScannedCode();return true;});return;}catch(_e){}
  }
  try{if(!('BarcodeDetector' in window))throw new Error('Вбудований QR-сканер недоступний. Введи код вручну або відкрий Mini App у Telegram.');stopScanner();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.getElementById('camera');video.srcObject=cameraStream;const detector=new BarcodeDetector({formats:['qr_code']});scanLoop=true;const tick=async()=>{if(!scanLoop||!video||video.readyState<2)return requestAnimationFrame(tick);try{const codes=await detector.detect(video);if(codes.length){document.getElementById('manualqr').value=codes[0].rawValue;stopScanner();openScannedCode();return;}}catch(_e){}requestAnimationFrame(tick);};video.onloadedmetadata=()=>video.play().then(tick);}catch(e){toast(e.message||'Не вдалося запустити камеру');}}

function stopScanner(){scanLoop=false;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}const video=document.getElementById('camera');if(video)video.srcObject=null;}
function openScannedCode(){const code=(document.getElementById('manualqr')?.value||'').trim();const match=code.match(/^box_(\d+)$/i);if(!match)return toast('Невірний QR-код. Очікується код виду box_12');stopScanner();go('box',Number(match[1]));}

route('admin',async()=>{render(topbar('Адмінка')+'<div class="center">Завантаження…</div>');const [pending,users]=await Promise.all([api('/api/admin/pending'),api('/api/admin/users')]);render(topbar('⚙️ Адмінка')+'<h2>Очікують підтвердження</h2>'+(pending.length?pending.map(u=>`<div class="card"><div class="card-main"><div class="title">${esc(u.username)}</div><div class="sub">ID: ${u.user_id}</div></div><div class="row"><button class="btn" onclick="approveUser(${u.user_id})">✓</button><button class="btn danger" onclick="rejectUser(${u.user_id})">×</button></div></div>`).join(''):'<div class="empty">Немає нових заявок</div>')+'<h2>Користувачі та ролі</h2>'+users.map(u=>`<div class="card" style="align-items:flex-start"><div class="card-main"><div class="title">${esc(u.username)}</div><div class="sub">ID: ${u.user_id} · ${u.status==='approved'?'Підтверджений':'Очікує'}</div></div><select style="width:130px;margin:0" onchange="setUserRole(${u.user_id},this.value)" ${u.user_id===ME.user_id?'disabled':''}><option value="worker" ${u.role==='worker'?'selected':''}>Працівник</option><option value="editor" ${u.role==='editor'?'selected':''}>Редактор</option><option value="admin" ${u.role==='admin'?'selected':''}>Адмін</option></select></div>`).join('')+`<div class="row" style="margin-top:14px"><button class="btn secondary" onclick="go('adminlogs')">Історія операцій</button></div>`);});
async function approveUser(id){try{await api(`/api/admin/approve/${id}`,{method:'POST',body:{}});go('admin');}catch(e){toast(e.message);}}
async function rejectUser(id){if(!confirm('Видалити заявку цього користувача?'))return;try{await api(`/api/admin/reject/${id}`,{method:'POST',body:{}});go('admin');}catch(e){toast(e.message);}}
async function setUserRole(id,role){try{await api(`/api/admin/users/${id}/role`,{method:'POST',body:{role}});toast('Роль оновлено');}catch(e){toast(e.message);go('admin');}}
route('adminlogs',async()=>{render(topbar('Історія операцій','admin')+'<div class="center">Завантаження…</div>');const rows=await api('/api/admin/logs?limit=200');render(topbar('Історія операцій','admin')+(rows.length?rows.map(r=>`<div class="history"><b>${esc(r.item_name||'Видалений товар')} · ${r.action==='inc'?'+' : '−'}${r.qty} шт.</b><br>${esc(r.username||'')} · ${esc(r.date||'')} ${r.box_name?'· '+esc(r.box_name):''}<br>${esc(r.reason||'')}</div>`).join(''):'<div class="empty">Операцій поки немає</div>'));});

async function boot(){try{if(!tg||!initData)throw new Error('Відкрий Mini App через Telegram, щоб передати дані авторизації.');ME=await api('/api/me');if(ME.status==='pending'){render(topbar('Очікування підтвердження',null)+`<div class="center">Ваш запит на доступ до складу надіслано адміністратору.<br><br>Після підтвердження закрийте та знову відкрийте застосунок.</div>`);return;}await go('menu');}catch(e){render(topbar('Не вдалося увійти',null)+`<div class="center">${esc(e.message)}<br><br><button class="btn" onclick="boot()">Спробувати ще раз</button></div>`);}}
window.addEventListener('beforeunload',stopScanner);
boot();
</script></body></html>
