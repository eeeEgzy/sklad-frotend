<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Склад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { padding: 12px 14px 90px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 14px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  .card {
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .card.click {
    cursor: pointer;
}
.card.click:active {
    transform: scale(0.97);
    opacity: 0.9;
}
.card-main {
    flex: 1;
}
.card .title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
}
.card .sub {
    font-size: 13px;
    color: var(--hint);
    margin-top: 3px;
}
  .menu-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    background: #1c1c1e;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 20px 20px;
    margin-bottom: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    transition: all 0.2s ease;
  }
  .menu-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }
  .menu-btn.admin-btn {
    background: linear-gradient(135deg, #1c1c1e, #2c1f1f);
    border: 1px solid rgba(224, 67, 58, 0.4);
    box-shadow: 0 4px 16px rgba(224, 67, 58, 0.15);
  }
  .st { display:inline-block; padding:3px 9px; border-radius:10px; font-size:13px; font-weight:600; white-space:nowrap; }
  .st-work { background:#1f7a3d; color:#fff; }
  .st-maintenance { background:#c98a00; color:#fff; }
  .st-repair { background:#c0392b; color:#fff; }
  .st-line_down { background:#555b66; color:#fff; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .chips .btn { white-space:nowrap; flex:0 0 auto; }
  .history.reverted { opacity: .55; }
  .history.reverted b { text-decoration: line-through; }
  .filters { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:10px; }
  .filters .full { grid-column: 1 / -1; }
  .card.deleting { outline: 2px solid #e0433a; color: #e0433a; }
  .btn:active { opacity: .85; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--bg); color: var(--text); border-radius: 14px; padding: 16px; width: 100%; max-width: 420px; }
  .modal h2 { margin-top: 0; }
  .qty, .qty-badge {
    font-weight: 600; font-size: 14px;
    padding: 4px 10px; border-radius: 10px;
    background: var(--bg); white-space: nowrap;
  }
  .qty.low, .qty-low { color: #e0433a; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--button); color: var(--button-text);
    border: none; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; cursor: pointer;
  }
  .btn.secondary { background: var(--secondary-bg); color: var(--text); }
  .btn.danger { background: #e0433a; color: #fff; }
  .btn:disabled { opacity: .5; }
  .form {
    background: var(--secondary-bg);
    padding: 12px 14px; border-radius: 12px; margin-top: 14px;
  }
  .form h2 { margin-top: 0; }
  label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--hint); background: var(--bg); color: var(--text);
    font-size: 15px; margin-bottom: 10px;
  }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .topbar .back { cursor: pointer; font-size: 22px; color: var(--link); padding: 2px 6px; }
  .hint { color: var(--hint); font-size: 13px; margin: 6px 0 12px; }
  .history, .history-item {
    font-size: 13px; color: var(--text);
    background: var(--secondary-bg); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; line-height: 1.4;
  }
  .center { text-align: center; padding: 40px 0; color: var(--hint); }
  .empty { text-align: center; padding: 24px 0; color: var(--hint); font-size: 14px; }
  .video { width: 100%; max-height: 260px; background: #000; border-radius: 12px; margin-bottom: 10px; object-fit: cover; }
  .qr { display: block; max-width: 220px; margin: 12px auto 4px; border-radius: 10px; }
  .avatar { position: relative; flex: none; border-radius: 50%; overflow: hidden; background: var(--button); color: var(--button-text); display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .avatar img.on { display: block; }
</style>
</head>
<body>
<div id="app"><div class="center">Завантаження…</div></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}

const API_BASE = window.SKLAD_API_BASE || "https://Valetnyn.pythonanywhere.com";
const initData = (tg && tg.initData) ? tg.initData : "";

let ME = null;
const app = document.getElementById("app");

// Нативна кнопка «Назад» у шапці Telegram (замість хрестика)
const HAS_TG_BACK = Boolean(tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1"));
let pendingBack = null;
let currentBack = null;

function syncBackButton() {
  currentBack = pendingBack;
  pendingBack = null;
  if (!HAS_TG_BACK) return;
  try {
    if (currentBack) tg.BackButton.show();
    else tg.BackButton.hide();
  } catch (_e) {}
}

if (HAS_TG_BACK) {
  tg.BackButton.onClick(() => {
    if (currentBack) go(currentBack);
  });
}

function render(html) {
  app.innerHTML = html;
  syncBackButton();
  hydratePhotos();
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function enc(str) {
  return encodeURIComponent(String(str ?? ""));
}

function isAdmin() {
  return Boolean(ME && ME.role === "admin");
}

function canAdd() {
  return ["admin", "manager", "editor", "assistant"].includes(ME?.role);
}

function canUsers() {
  return ["admin", "manager"].includes(ME?.role);
}

function canEquip() {
  return ["admin", "manager", "editor"].includes(ME?.role);
}

function canUndo() {
  return canEdit();
}

function canEdit() {
  return ["admin", "manager", "editor", "assistant"].includes(ME?.role);
}

function formField(labelText, id, type = "text", defaultVal = "") {
  return `<label for="${esc(id)}">${esc(labelText)}</label><input type="${esc(type)}" id="${esc(id)}" value="${esc(defaultVal)}">`;
}

function itemCard(i, showCategory = true) {
  return `<div class="card click" onclick="go('item', ${Number(i.id)})">
    <div class="card-main">
      <div class="title">${esc(i.name)}</div>
      ${showCategory ? `<div class="sub">${esc(i.category || "")}</div>` : ""}
    </div>
    <span class="qty ${i.quantity <= (i.min ?? 4) ? "low" : ""}">${i.quantity} шт.</span>
  </div>`;
}

function topbar(title, backTo = "menu") {
  pendingBack = backTo || null;
  return `<div class="topbar">
    ${backTo && !HAS_TG_BACK ? `<span class="back" onclick="go('${esc(backTo)}')">←</span>` : ""}
    <h1 style="margin:0">${esc(title)}</h1>
  </div>`;
}

function toast(msg) {
  if (tg && tg.showAlert) {
    try { tg.showAlert(String(msg)); return; } catch (_e) {}
  }
  alert(String(msg));
}

function confirmDlg(msg) {
  return new Promise(resolve => {
    if (tg && typeof tg.showConfirm === "function" && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) {
      try { tg.showConfirm(String(msg), ok => resolve(Boolean(ok))); return; } catch (_e) {}
    }
    resolve(window.confirm(String(msg)));
  });
}

function askForm(title, fields) {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.className = "modal-overlay";
    ov.innerHTML = `<div class="modal"><h2>${esc(title)}</h2>` +
      fields.map(f => f.type === "select"
        ? `<label>${esc(f.label)}</label><select id="mf_${esc(f.id)}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`
        : `<label>${esc(f.label)}</label><input id="mf_${esc(f.id)}" type="${esc(f.type || "text")}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}" ${f.type === "number" ? 'inputmode="numeric" min="1"' : ""}>`).join("") +
      `<div class="row" style="flex-wrap:nowrap"><button class="btn secondary" style="flex:1" id="mf_cancel">Скасувати</button><button class="btn" style="flex:1" id="mf_ok">ОК</button></div></div>`;
    document.body.appendChild(ov);
    const close = v => { ov.remove(); resolve(v); };
    ov.querySelector("#mf_cancel").onclick = () => close(null);
    ov.querySelector("#mf_ok").onclick = () => {
      const out = {};
      fields.forEach(f => { out[f.id] = ov.querySelector("#mf_" + f.id).value; });
      close(out);
    };
  });
}

function openLink(url) {
  if (tg && typeof tg.openLink === "function") { tg.openLink(url); return false; }
  return true;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(API_BASE + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": initData,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText || `Помилка ${res.status}`;
    try {
      const errJson = await res.json();
      msg = errJson.detail || errJson.error || errJson.message || msg;
    } catch (_e) {}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res;
}

const ROLE_LABELS = { admin: "Адмін", manager: "Зав складу", editor: "Редактор", assistant: "Помічник складу", worker: "Працівник" };
const ROLE_COLORS = { admin: "#2481cc", manager: "#8e44ad", editor: "#388a34", assistant: "#16a0a0", worker: "#e09f3a" };

function fmtDate(str) {
  const d = new Date(String(str).replace(" ", "T") + "Z");
  return isNaN(d) ? esc(str) : d.toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

const photoCache = {};
function avatar(uid, name, size) {
  const ch = esc(String(name || "?").trim().charAt(0).toUpperCase());
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px"><span>${ch}</span><img data-uid="${Number(uid)}" alt=""></div>`;
}
function hydratePhotos() {
  document.querySelectorAll("img[data-uid]").forEach(async img => {
    const uid = img.dataset.uid;
    if (!(uid in photoCache)) {
      photoCache[uid] = fetch(API_BASE + `/api/users/${uid}/photo`, { headers: { "X-Telegram-Init-Data": initData } })
        .then(r => (r.ok ? r.blob() : null))
        .then(b => (b ? URL.createObjectURL(b) : null))
        .catch(() => null);
    }
    const url = await photoCache[uid];
    if (url) { img.src = url; img.classList.add("on"); }
  });
}

function itemControls(item, reasons) {
  return `<div class="form" style="margin-top:0">
    <input type="number" id="qty" value="1" min="1" inputmode="numeric" placeholder="Кількість">
    <input type="text" id="reason" list="reasons-list" placeholder="Куди списали (Необов’язково)">
    <datalist id="reasons-list">${reasons.map(r => `<option value="${esc(r)}">`).join("")}</datalist>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn danger" style="flex:1" onclick="changeItemQty(${item.id}, -1)">− Списати</button>
      ${canAdd() ? `<button class="btn" style="flex:1" onclick="changeItemQty(${item.id}, 1)">＋ Поповнити</button>` : ""}
    </div>
    ${canEdit() ? `<button class="btn secondary" style="color:#e0433a;margin-top:10px" onclick="deleteItem(${item.id}, decodeURIComponent('${enc(item.category)}'))">🗑 Видалити товар</button>` : ""}
  </div>`;
}

let lastRouteName = "menu";
let lastRouteArgs = [];
const routes = {};

function route(name, fn) {
  routes[name] = fn;
}

async function go(name, ...args) {
  try {
    stopScanner();
    if (name === "previous") {
      return await routes[lastRouteName](...lastRouteArgs);
    }
    if (name !== "scan" && name !== "item") {
      lastRouteName = name;
      lastRouteArgs = args;
    }
    if (!routes[name]) throw new Error(`Маршрут "${name}" не знайдено`);
    await routes[name](...args);
  } catch (e) {
    toast("Помилка: " + e.message);
  }
}

// ================= МАРШРУТИ =================

route("menu", async () => {
  const roleName = ROLE_LABELS[ME?.role] || "Працівник";
  render(`
    ${topbar("📦 Склад", null)}
    ${ME ? `<div style="display:flex;align-items:center;gap:12px;margin:4px 0 16px">${avatar(ME.user_id, ME.username, 48)}<div><div style="font-weight:600">${esc(ME.username)}</div><div class="hint">${roleName}</div></div></div>` : ""}
    <button class="menu-btn" onclick="go('categories')">📦 Товари та категорії</button>
    <button class="menu-btn" onclick="go('search')">🔍 Пошук товару</button>
    <button class="menu-btn" onclick="go('deficit')">⚠️ Дефіцит і малі залишки</button>
    <button class="menu-btn" onclick="go('boxes')">🧰 Бокси</button>
    <button class="menu-btn" onclick="go('scan')">📷 Сканувати QR боксу</button>
    ${canEdit() ? `<button class="menu-btn" onclick="go('reports')">📊 Звіти (Google Таблиці)</button>` : ""}
    <button class="menu-btn" onclick="go('equipment')">🏭 Обладнання та лінії</button>
    ${canUsers() ? `<button class="menu-btn" onclick="go('audit')">📋 Ревізія</button>` : ""}
    <button class="menu-btn" onclick="go('adminlogs')">📜 Історія операцій</button>
    ${canUsers() ? `<button class="menu-btn admin-btn" onclick="go('admin')">⚙️ Адмінка</button>` : ""}
    ${ME && ME.status === "pending" ? `<p class="hint">Ваш акаунт очікує підтвердження адміністратора.</p>` : ""}
  `);
});

let CATS = [];
let deleteMode = false;

route("categories", async () => {
  deleteMode = false;
  render(topbar("Категорії", "menu") + `<div class="center">Завантаження…</div>`);
  CATS = await api("/api/categories");
  renderCategories();
});

function renderCategories(typed = "") {
  render(
    topbar("📦 Категорії", "menu") +
    (deleteMode ? `<p class="hint" style="color:#e0433a">Режим видалення: натисни на категорію, яку треба видалити.</p>` : "") +
    (CATS.length
      ? CATS.map((c, i) => `<div class="card click ${deleteMode ? "deleting" : ""}" onclick="catClick(${i})"><span class="title">${esc(c)}</span><span>${deleteMode ? "✕" : "›"}</span></div>`).join("")
      : `<div class="empty">Категорій поки немає</div>`) +
    (canEdit()
      ? `<div class="form"><h2>Додати категорію</h2>${formField("Назва категорії", "newcat", "text", typed)}<div class="row"><button class="btn" onclick="createCategory()">＋ Створити категорію</button><button class="btn danger" onclick="toggleDeleteMode()">${deleteMode ? "Готово" : "－ Видалити категорію"}</button></div></div>`
      : "")
  );
}

function catClick(i) {
  const name = CATS[i];
  if (name === undefined) return;
  if (deleteMode) return deleteCategory(name);
  go("items", name);
}

function toggleDeleteMode() {
  const typed = document.getElementById("newcat")?.value || "";
  deleteMode = !deleteMode;
  renderCategories(typed);
}

async function deleteCategory(name) {
  if (!(await confirmDlg(`Видалити категорію «${name}»?`))) return;
  try {
    await api("/api/categories/delete", { method: "POST", body: { name } });
    CATS = CATS.filter(c => c !== name);
    toast("Категорію видалено");
    renderCategories();
  } catch (e) {
    toast(e.message);
  }
}

async function createCategory() {
  const input = document.getElementById("newcat");
  const name = input ? input.value.trim() : "";
  if (!name) return toast("Введи назву категорії");
  try {
    await api("/api/categories", { method: "POST", body: { name } });
    toast("Категорію створено");
    go("categories");
  } catch (e) {
    toast(e.message);
  }
}

route("items", async (category) => {
  const catName = String(category);
  render(topbar(catName, "categories") + `<div class="center">Завантаження товарів…</div>`);
  const items = await api("/api/items?category=" + enc(catName));
  render(
    topbar(catName, "categories") +
    (items.length
      ? items.map(i => itemCard(i, false)).join("")
      : `<div class="empty">У цій категорії товарів поки немає</div>`) +
    (canEdit()
      ? `<div class="form"><h2>Додати товар</h2>${formField("Назва товару", "newitem")}${formField("Початкова кількість", "newqty", "number", "0")}<button class="btn" onclick="createItem(decodeURIComponent('${enc(catName)}'))">＋ Додати товар</button></div>`
      : "")
  );
});

async function createItem(category) {
  const name = document.getElementById("newitem").value.trim();
  const quantity = Number(document.getElementById("newqty").value || 0);
  if (!name) return toast("Введи назву товару");
  if (!Number.isInteger(quantity) || quantity < 0) return toast("Кількість має бути цілим невід’ємним числом");
  try {
    await api("/api/items", { method: "POST", body: { name, quantity, category } });
    toast("Товар додано");
    go("items", category);
  } catch (e) {
    toast(e.message);
  }
}

route("item", async (id) => {
  render(topbar("Товар", "previous") + `<div class="center">Завантаження…</div>`);
  const item = await api("/api/items/" + id);
  const history = item.history || [];
  let reasons = [];
  try { reasons = await api("/api/reasons"); } catch (_e) {}
  render(
    topbar(item.name, "previous") +
    `<div class="card">
      <div class="card-main">
        <div class="title">${esc(item.name)}</div>
        <div class="sub">${esc(item.category)}</div>
      </div>
      <span class="qty ${item.quantity <= (item.min ?? 4) ? "low" : ""}">${item.quantity} шт.</span>
    </div>
    ${itemControls(item, reasons)}
    ${canUsers() ? `<div class="form"><label for="minqty">Мінімальний залишок (при ньому приходить сповіщення в Telegram)</label><div class="row" style="flex-wrap:nowrap"><input type="number" id="minqty" value="${item.min_qty ?? ""}" placeholder="за замовч. ${Number(item.min)}" min="0" inputmode="numeric" style="flex:1"><button class="btn" onclick="saveMinQty(${item.id})">Зберегти</button></div></div>` : ""}
    <h2>Історія операцій</h2>` +
    (history.length
      ? history.map(h => `<div class="history ${h.reverted ? "reverted" : ""}"><b>${h.action === "inc" ? "+" : "−"}${h.qty} шт.</b> · ${esc(h.username || "")} · ${fmtDate(h.date)}${h.reverted ? " · ↩️ скасовано" : ""}<br>${esc(h.reason || "")}</div>`).join("")
      : `<div class="empty">Історії поки немає</div>`)
  );
});

async function changeItemQty(itemId, sign) {
  const amount = parseInt(document.getElementById("qty").value, 10);
  const reason = (document.getElementById("reason").value || "").trim();
  if (!Number.isInteger(amount) || amount < 1) return toast("Вкажи ціле число більше нуля");
  try {
    const body = { delta: sign * amount };
    if (sign < 0 && reason) body.reason = reason;   // причина необов’язкова
    await api(`/api/items/${itemId}/qty`, { method: "POST", body });
    toast("Залишок оновлено");
    go("item", itemId);
  } catch (e) {
    toast(e.message);
  }
}

async function deleteItem(itemId, category) {
  if (!(await confirmDlg("Видалити цей товар зі складу назавжди?"))) return;
  try {
    await api(`/api/items/${itemId}`, { method: "DELETE" });
    toast("Товар видалено");
    go("items", category);
  } catch (e) {
    toast(e.message);
  }
}

route("search", async () => {

let cameraStream = null, scanLoop = false;
route("scan", async () => {
  render(
    topbar("Сканер QR", "menu") +
    `<p class="hint">Наведи камеру на QR-код боксу. Якщо камера недоступна, введи код вручну (наприклад: box_12).</p>
     <video id="camera" class="video" autoplay playsinline></video>
     <div class="row">
       <button class="btn" onclick="startScanner()">Увімкнути камеру</button>
       <button class="btn secondary" onclick="stopScanner()">Зупинити</button>
     </div>
     <div class="form">
       <label>Код боксу</label>
       <input type="text" id="manualqr" placeholder="box_12">
       <button class="btn" onclick="openScannedCode()">Відкрити бокс</button>
     </div>
     <div id="scanstatus" class="hint"></div>`
  );
});

async function startScanner() {
  if (tg && typeof tg.showScanQrPopup === "function") {
    try {
      tg.showScanQrPopup({ text: "Наведіть камеру на QR-код боксу" }, (text) => {
        const field = document.getElementById("manualqr");
        if (field) field.value = text;
        tg.closeScanQrPopup();
        openScannedCode();
        return true;
      });
      return;
    } catch (_e) {}
  }
  try {
    if (!("BarcodeDetector" in window)) {
      throw new Error("Вбудований QR-сканер недоступний. Введи код вручну або відкрий Mini App у Telegram.");
    }
    stopScanner();
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    const video = document.getElementById("camera");
    video.srcObject = cameraStream;
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    scanLoop = true;
    const tick = async () => {
      if (!scanLoop || !video || video.readyState < 2) return requestAnimationFrame(tick);
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          document.getElementById("manualqr").value = codes[0].rawValue;
          stopScanner();
          openScannedCode();
          return;
        }
      } catch (_e) {}
      requestAnimationFrame(tick);
    };
    video.onloadedmetadata = () => video.play().then(tick);
  } catch (e) {
    toast(e.message || "Не вдалося запустити камеру");
  }
}

function stopScanner() {
  scanLoop = false;
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById("camera");
  if (video) video.srcObject = null;
}

function openScannedCode() {
  const code = (document.getElementById("manualqr")?.value || "").trim();
  const match = code.match(/^(box|item)_(\d+)$/i);
  if (!match) return toast("Невірний QR-код. Очікується код виду box_12 або item_7");
  stopScanner();
  go(match[1].toLowerCase(), Number(match[2]));
}

function logRowHtml(r) {

    ? `<br><button class="btn secondary" style="margin-top:6px" onclick="undoLog(${Number(r.id)})">↩️ Скасувати операцію</button>` : "";
  return `<div class="history ${r.reverted ? "reverted" : ""}"><b>${sign}${Number(r.qty)} шт. · ${esc(r.item_name || "видалений товар")}</b>${note}<br>👤 ${esc(r.username || r.user_id || "—")} · ${fmtDate(r.date)}${r.box_name ? "<br>🧰 " + esc(r.box_name) : ""}${r.reason ? "<br>📝 " + esc(r.reason) : ""}${undoBtn}</div>`;

  return `<div class="filters">

    <select id="lf_user" class="full">${opt("", "Усі користувачі", f.user_id)}${logUsers.map(u => opt(u.user_id, u.username, f.user_id)).join("")}</select>

  auditScope = String(category);
  render(topbar(auditScope, "audit") + `<div class="center">Завантаження…</div>`);
  const items = await api("/api/items?category=" + enc(auditScope));
  render(
    topbar("📋 " + auditScope, "audit") +
    `<p class="hint">Вкажи, скільки є фактично (разом із тим, що лежить у боксах). Порожнє поле = не перераховував, товар не чіпаємо.</p>` +
    (items.length
      ? items.map(i => `<div class="card"><div class="card-main"><div class="title">${esc(i.name)}</div><div class="sub">У системі: ${Number(i.quantity)} шт.</div></div><input class="auditin" type="number" min="0" inputmode="numeric" data-id="${Number(i.id)}" data-exp="${Number(i.quantity)}" placeholder="${Number(i.quantity)}" style="width:90px"></div>`).join("") +
        `<button class="btn" style="width:100%;margin-top:10px" onclick="applyAudit()">✅ Застосувати ревізію</button>`
      : `<div class="empty">У цій категорії товарів немає</div>`)
  );
});

async function applyAudit() {
  const entries = [];
  let diffs = 0;
  document.querySelectorAll(".auditin").forEach(inp => {
    const v = inp.value.trim();
    if (v === "") return;
    const counted = parseInt(v, 10);
    if (!Number.isInteger(counted) || counted < 0) return;
    entries.push({ item_id: Number(inp.dataset.id), counted });
    if (counted !== Number(inp.dataset.exp)) diffs++;
  });
  if (!entries.length) return toast("Внеси хоча б одну кількість");
  if (!(await confirmDlg(`Перераховано позицій: ${entries.length}. Розбіжностей: ${diffs}. Виправити залишки в системі?`))) return;
  try {
    const r = await api("/api/audit/apply", { method: "POST", body: { scope: auditScope, items: entries } });
    renderAuditResult(r);
  } catch (e) {
    toast(e.message);
  }
}

function renderAuditResult(r) {
  render(
    topbar("Результат ревізії", "audit") +
    `<div class="card"><div class="card-main"><div class="title">Ревізія: ${esc(auditScope)}</div><div class="sub">Перераховано: ${Number(r.checked)} · збіглось: ${Number(r.matched)} · виправлено: ${r.changes.length}</div></div></div>` +
    (r.changes.length ? "<h2>Розбіжності</h2>" + r.changes.map(c => `<div class="history"><b>${esc(c.name)}</b><br>Було ${Number(c.before)} → стало ${Number(c.after)} (${c.diff > 0 ? "+ надлишок " : "− нестача "}${Math.abs(Number(c.diff))} шт.)</div>`).join("") : `<div class="empty">Розбіжностей немає 👍</div>`) +
    (r.errors.length ? "<h2>Не вдалося виправити</h2>" + r.errors.map(e => `<div class="history" style="color:#e0433a">${esc(e)}</div>`).join("") : "") +
    `<button class="btn" style="width:100%;margin-top:10px" onclick="go('audit')">До списку категорій</button>`
  );
}

// ================= ОБЛАДНАННЯ ТА ЛІНІЇ (бачать усі, змінюють — від редактора) =================
const EQ_STATUS = {
  work: ["Працює", "st-work", "🟢"],
  maintenance: ["Планове ТО", "st-maintenance", "🟡"],
  repair: ["Ремонт обладнання", "st-repair", "🔴"],
  line_down: ["Лінія не працює", "st-line_down", "⚫"],
};
const EQ_RANK = { work: 0, maintenance: 1, repair: 2, line_down: 3 };
let EQ = { workshops: [], workshop: "", lines: [], lineId: null, deleteMode: false };

function stBadge(st) {
  const s = EQ_STATUS[st] || EQ_STATUS.work;
  return `<span class="st ${s[1]}">${s[0]}</span>`;
}

function nowLocalInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

function eqRange(from, until) {
  return `${fmtDate(from)} → ${until ? fmtDate(until) : "без кінця"}`;
}

function curLine() {
  return EQ.lines.find(l => l.id === EQ.lineId);
}

function worstHealth(lines) {
  return lines.reduce((w, l) => (EQ_RANK[l.health] > EQ_RANK[w] ? l.health : w), "work");
}

route("equipment", async (lineId) => {
  render(topbar("🏭 Обладнання", "menu") + `<div class="center">Завантаження…</div>`);
  const data = await api("/api/equipment");
  EQ.lines = data.lines;
  EQ.workshops = data.workshops;
  if (lineId) {
    const l = EQ.lines.find(x => x.id === Number(lineId));
    if (l) { EQ.lineId = l.id; EQ.workshop = l.workshop; }
  }
  if (!EQ.workshops.includes(EQ.workshop)) EQ.workshop = EQ.workshops[0] || "";
  const inWs = EQ.lines.filter(l => l.workshop === EQ.workshop);
  if (!inWs.some(l => l.id === EQ.lineId)) EQ.lineId = inWs.length ? inWs[0].id : null;
  EQ.deleteMode = false;
  renderEquipment();
  loadEquipEvents();
});

function renderEquipment(typed = "") {
  const edit = canEquip();
  const inWs = EQ.lines.filter(l => l.workshop === EQ.workshop);
  const line = curLine();

  const wsChips = EQ.workshops.map((w, i) => {
    const h = worstHealth(EQ.lines.filter(l => l.workshop === w));
    return `<button class="btn ${w === EQ.workshop ? "" : "secondary"}" onclick="eqPickWorkshop(${i})">${EQ_STATUS[h][2]} ${esc(w)}</button>`;
  }).join("");
  const lineChips = inWs.map(l => `<button class="btn ${l.id === EQ.lineId ? "" : "secondary"}" onclick="eqPickLine(${Number(l.id)})">${EQ_STATUS[l.health][2]} ${esc(l.name)}</button>`).join("");

  const addLineForm = edit
    ? `<div class="form"><h2>Додати лінію в «${esc(EQ.workshop)}»</h2>${formField("Назва лінії", "linename", "text", "")}<button class="btn" onclick="eqAddLine()">＋ Додати лінію</button></div>`
    : "";

  let body = "";
  if (!line) {
    body = `<div class="empty">У цьому цеху ще немає ліній</div>` + addLineForm;
  } else {
    const lineInfo = `<div class="card"><div class="card-main"><div class="title">${esc(line.workshop)} · ${esc(line.name)}</div><div class="sub">${line.status !== "work" ? eqRange(line.from, line.until) + (line.note ? " · " + esc(line.note) : "") : `Ремонт: ${Number(line.counts.repair)} · ТО: ${Number(line.counts.maintenance)}`}${line.next ? `<br>Далі: ${esc(EQ_STATUS[line.next.status][0])} з ${fmtDate(line.next.from)}` : ""}</div></div>${stBadge(line.status)}</div>` +
      (edit ? `<div class="row" style="margin-bottom:10px"><button class="btn" style="flex:1" onclick="eqMark(null)">⚙️ Позначити всю лінію</button><button class="btn danger" onclick="eqDeleteLine()">🗑 Лінію</button></div>` : "");
    const items = line.equipment.map(e => {
      const detail = (e.status !== "work" ? eqRange(e.from, e.until) + (e.source === "line" ? " (через лінію)" : "") + (e.note ? " · " + esc(e.note) : "") : "") +
        (e.next ? `${e.status !== "work" ? "<br>" : ""}Далі: ${esc(EQ_STATUS[e.next.status][0])} з ${fmtDate(e.next.from)}` : "");
      return `<div class="card ${edit ? "click" : ""} ${EQ.deleteMode ? "deleting" : ""}" ${edit ? `onclick="eqClick(${Number(e.id)})"` : ""}><div class="card-main"><div class="title">${esc(e.name)}</div>${detail ? `<div class="sub">${detail}</div>` : ""}</div>${EQ.deleteMode ? "<span>✕</span>" : stBadge(e.status)}</div>`;
    }).join("");
    body = lineInfo +
      (edit ? (EQ.deleteMode ? `<p class="hint" style="color:#e0433a">Режим видалення: натисни на обладнання, яке треба прибрати зі списку.</p>` : `<p class="hint">Натисни на обладнання, щоб позначити ТО, ремонт чи повернення в роботу.</p>`) : "") +
      (items || `<div class="empty">На цій лінії обладнання ще немає</div>`) +
      (edit ? `<div class="form"><h2>Додати обладнання</h2>${formField("Назва обладнання", "eqname", "text", typed)}<div class="row"><button class="btn" onclick="eqAdd()">＋ Додати обладнання</button><button class="btn danger" onclick="eqToggleDelete()">${EQ.deleteMode ? "Готово" : "－ Видалити обладнання"}</button></div></div>` : "") +
      addLineForm +
      `<h2>Заплановані та історія</h2><div id="eqevents"><div class="center">Завантаження…</div></div>`;
  }

  render(
    topbar("🏭 Обладнання", "menu") +
    `<div class="chips">${wsChips}</div>` +
    (lineChips ? `<div class="chips">${lineChips}</div>` : "") +
    body
  );
}

function eqPickWorkshop(i) {
  const w = EQ.workshops[i];
  if (w === undefined) return;
  EQ.workshop = w;
  const inWs = EQ.lines.filter(l => l.workshop === w);
  EQ.lineId = inWs.length ? inWs[0].id : null;
  EQ.deleteMode = false;
  renderEquipment();
  loadEquipEvents();
}

function eqPickLine(id) {
  EQ.lineId = id;
  EQ.deleteMode = false;
  renderEquipment();
  loadEquipEvents();
}

function eqToggleDelete() {
  const typed = document.getElementById("eqname")?.value || "";
  EQ.deleteMode = !EQ.deleteMode;
  renderEquipment(typed);
  loadEquipEvents();
}

function eqClick(equipId) {
  if (!canEquip()) return;
  if (EQ.deleteMode) return eqDelete(equipId);
  eqMark(equipId);
}

async function eqMark(equipId) {
  const line = curLine();
  if (!line || !canEquip()) return;
  const eq = equipId ? line.equipment.find(e => e.id === equipId) : null;
  const options = [["work", "Працює"], ["maintenance", "Планове ТО"], ["repair", "Ремонт обладнання"]];
  if (!equipId) options.push(["line_down", "Лінія не працює"]);
  const res = await askForm(eq ? eq.name : `${line.name} — уся лінія`, [
    { id: "status", label: "Статус", type: "select", value: "maintenance", options: options.map(([value, label]) => ({ value, label })) },
    { id: "start", label: "Початок", type: "datetime-local", value: nowLocalInput() },
    { id: "end", label: "Закінчення (необов’язково)", type: "datetime-local", value: "" },
    { id: "note", label: "Примітка (необов’язково)", value: "", placeholder: "напр. заміна підшипника" },
  ]);
  if (!res) return;
  try {
    await api("/api/equipment/events", { method: "POST", body: {
      line_id: line.id, equipment_id: equipId || null, status: res.status,
      start: res.start, end: res.end, note: res.note.trim(),
    } });
    toast("Статус збережено");
    go("equipment", line.id);
  } catch (e) {
    toast(e.message);
  }
}

async function eqAddLine() {
  const name = document.getElementById("linename").value.trim();
  if (!name) return toast("Введи назву лінії");
  try {
    const r = await api("/api/equipment/lines", { method: "POST", body: { workshop: EQ.workshop, name } });
    toast("Лінію додано");
    go("equipment", r.id);
  } catch (e) {
    toast(e.message);
  }
}

async function eqDeleteLine() {
  const line = curLine();
  if (!line) return;
  const n = line.equipment.length;
  if (!(await confirmDlg(`Видалити «${line.name}» (${EQ.workshop})? Разом із нею видалиться обладнання (${n}) та вся історія статусів.`))) return;
  try {
    await api("/api/equipment/lines/" + line.id, { method: "DELETE" });
    EQ.lineId = null;
    toast("Лінію видалено");
    go("equipment");
  } catch (e) {
    toast(e.message);
  }
}

async function eqAdd() {
  const name = document.getElementById("eqname").value.trim();
  if (!name) return toast("Введи назву обладнання");
  try {
    await api("/api/equipment", { method: "POST", body: { line_id: EQ.lineId, name } });
    go("equipment", EQ.lineId);
  } catch (e) {
    toast(e.message);
  }
}

async function eqDelete(equipId) {
  const line = curLine();
  const eq = line && line.equipment.find(e => e.id === equipId);
  if (!eq) return;
  if (!(await confirmDlg(`Видалити «${eq.name}» зі списку? Його історія статусів теж видалиться.`))) return;
  try {
    await api("/api/equipment/" + equipId, { method: "DELETE" });
    line.equipment = line.equipment.filter(e => e.id !== equipId);
    toast("Обладнання видалено");
    renderEquipment();
    loadEquipEvents();
  } catch (e) {
    toast(e.message);
  }
}

async function loadEquipEvents() {
  const box = document.getElementById("eqevents");
  if (!box || !EQ.lineId) return;
  const edit = canEquip();
  try {
    const rows = await api("/api/equipment/events?line_id=" + EQ.lineId);
    const stateLabel = { planned: "🕒 заплановано", active: "▶️ триває", finished: "✔️ завершено" };
    box.innerHTML = rows.length ? rows.map(r => `<div class="history ${r.state === "finished" ? "reverted" : ""}"><b>${esc(EQ_STATUS[r.status][0])}</b> · ${esc(r.target)} · ${stateLabel[r.state]}<br>${eqRange(r.from, r.until)}${r.note ? "<br>📝 " + esc(r.note) : ""}<br>👤 ${esc(r.username)}${edit ? `<br>${r.state === "active" ? `<button class="btn secondary" style="margin-top:6px" onclick="eqEndEvent(${Number(r.id)})">⏹ Завершити зараз</button> ` : ""}<button class="btn secondary" style="margin-top:6px" onclick="eqDeleteEvent(${Number(r.id)})">🗑 Видалити запис</button>` : ""}</div>`).join("") : `<div class="empty">Записів поки немає</div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty">Не вдалося завантажити: ${esc(e.message)}</div>`;
  }
}

async function eqEndEvent(id) {
  try {
    await api(`/api/equipment/events/${id}/end`, { method: "POST" });
    toast("Завершено");
    go("equipment", EQ.lineId);
  } catch (e) {
    toast(e.message);
  }
}

async function eqDeleteEvent(id) {
  if (!(await confirmDlg("Видалити цей запис зі статусів?"))) return;
  try {
    await api("/api/equipment/events/" + id, { method: "DELETE" });
    go("equipment", EQ.lineId);
  } catch (e) {
    toast(e.message);
  }
}

async function boot() {
  try {
    if (!tg || !initData) {
      throw new Error("Відкрий Mini App через Telegram, щоб передати дані авторизації.");
    }
    ME = await api("/api/me");
    if (ME.status === "removed") {
      render(topbar("Доступ закрито", null) + `<div class="center">Адміністратор закрив вам доступ до складу.</div>`);
      return;
    }
    if (ME.status === "pending") {
      render(
        topbar("Очікування підтвердження", null) +
        `<div class="center">Ваш запит на доступ до складу надіслано адміністратору.<br><br>Після підтвердження закрийте та знову відкрийте застосунок.</div>`
      );
      return;
    }
    await go("menu");
  } catch (e) {
    render(
      topbar("Не вдалося увійти", null) +
      `<div class="center">${esc(e.message)}<br><br><button class="btn" onclick="boot()">Спробувати ще раз</button></div>`
    );
  }
}

window.addEventListener("beforeunload", stopScanner);
boot();
</script>
</body>
</html>
