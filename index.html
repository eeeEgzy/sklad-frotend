<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Склад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { padding: 12px 14px 90px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 14px; }
  h3 { margin: 18px 0 8px; font-size: 15px; }
  .card {
    background: var(--secondary-bg); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    cursor: pointer;
  }
  .card .title { font-size: 15px; }
  .card .sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .menu-btn {
    display: block; width: 100%; text-align: left;
    background: var(--secondary-bg); color: var(--text);
    border: none; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 8px;
    font-size: 15px; cursor: pointer;
  }
  .qty-badge { font-weight: 600; font-size: 14px; padding: 2px 10px; border-radius: 10px; background: var(--bg); }
  .qty-low { color: #e0433a; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    background: var(--button); color: var(--button-text);
    border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 15px; cursor: pointer;
  }
  .btn.danger { background: #e0433a; color: #fff; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .round-btn {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    border: none; background: var(--button); color: var(--button-text);
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .chips { display: flex; gap: 8px; margin: 10px 0 12px; flex-wrap: wrap; }
  .chip {
    flex: 1; min-width: 48px; padding: 9px 0; border-radius: 10px; font-size: 15px;
    border: 1px solid var(--hint); background: var(--bg); color: var(--text); cursor: pointer;
  }
  input[type=text], input[type=number], select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--hint); background: var(--bg); color: var(--text);
    font-size: 15px; margin-bottom: 10px;
  }
  select { width: auto; margin: 0; padding: 6px 8px; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topbar .back { cursor: pointer; font-size: 22px; color: var(--link); padding: 0 6px; }
  .hint { color: var(--hint); font-size: 13px; }
  .history-item { font-size: 13px; color: var(--hint); border-top: 1px solid var(--secondary-bg); padding: 6px 0; }
  .center { text-align: center; padding: 40px 0; color: var(--hint); }
  .pill { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 8px; background: var(--secondary-bg); margin: 0 6px 6px 0; }
  .pill.link { cursor: pointer; color: var(--link); }
  .profile { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .avatar {
    position: relative; flex: none; border-radius: 50%; overflow: hidden;
    background: var(--button); color: var(--button-text);
    display: flex; align-items: center; justify-content: center; font-weight: 600;
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .avatar img.on { display: block; }
</style>
</head>
<body>
<div id="app"><div class="center">Завантаження…</div></div>

<script>
const tg = (window.Telegram && window.Telegram.WebApp) || { initData: "", ready() {}, expand() {} };
tg.ready();
tg.expand();

const API_BASE = (window.SKLAD_API_BASE || "https://Valetnyn.pythonanywhere.com").replace(/\/$/, "");
const initData = tg.initData || "";

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(API_BASE + path, {
    method,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText || ("HTTP " + res.status);
    try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
// Дати в базі — UTC ("2026-11-17 14:05:00"); показуємо в місцевому часі
function fmtDate(s) {
  const d = new Date(String(s).replace(" ", "T") + "Z");
  return isNaN(d) ? esc(s) : d.toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

/* ---------- Ролі ---------- */
const ROLE_LABELS = { admin: "Адмін", manager: "Зав складу", editor: "Редактор", assistant: "Помічник складу", worker: "Працівник" };
let ME = null;
const role = () => (ME ? ME.role : "");
const canAdd = () => ["admin", "manager", "editor", "assistant"].includes(role());
const canEdit = () => ["admin", "manager", "editor"].includes(role());
const canUsers = () => ["admin", "manager"].includes(role());

/* ---------- Фото профілю ---------- */
const photoCache = {};
function avatar(uid, name, size) {
  const ch = esc(String(name || "?").trim().charAt(0).toUpperCase());
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px">
    <span>${ch}</span><img data-uid="${Number(uid)}" alt=""></div>`;
}
function hydratePhotos() {
  document.querySelectorAll("img[data-uid]").forEach(async img => {
    const uid = img.dataset.uid;
    if (!(uid in photoCache)) {
      photoCache[uid] = fetch(API_BASE + `/api/users/${uid}/photo`, { headers: { "X-Telegram-Init-Data": initData } })
        .then(r => (r.ok ? r.blob() : null))
        .then(b => (b ? URL.createObjectURL(b) : null))
        .catch(() => null);
    }
    const url = await photoCache[uid];
    if (url) { img.src = url; img.classList.add("on"); }
  });
}

const app = document.getElementById("app");
function render(html) { app.innerHTML = html; hydratePhotos(); }
function toast(msg) {
  if (tg.showAlert) { try { tg.showAlert(msg); return; } catch (e) {} }
  alert(msg);
}
function confirmAction(text, fn) {
  if (tg.showConfirm) tg.showConfirm(text, ok => { if (ok) fn(); });
  else if (confirm(text)) fn();
}
function topbar(title, showBack) {
  return `<div class="topbar">
    ${showBack ? `<span class="back" onclick="back()">←</span>` : ""}
    <h1 style="margin:0">${title}</h1></div>`;
}
const LOADING = `<div class="center">Завантаження…</div>`;

/* ---------- Навігація ---------- */
const routes = {};
function route(name, fn) { routes[name] = fn; }
const stack = [];
let cur = null;

async function run(name, args, push) {
  try {
    if (!routes[name]) throw new Error("Невідомий екран: " + name);
    if (name === "scan") { await routes[name](...args); return; }
    if (name === "menu") stack.length = 0;
    else if (push && cur) stack.push(cur);
    cur = { name, args };
    await routes[name](...args);
  } catch (e) { toast("Помилка: " + e.message); }
}
function go(name, ...args) { return run(name, args, true); }
function back() {
  const p = stack.pop();
  run(p ? p.name : "menu", p ? p.args : [], false);
}
function reRun() { if (cur) run(cur.name, cur.args, false); }

/* ---------- Дії ---------- */
async function createCategory() {
  const name = (document.getElementById("newcat").value || "").trim();
  if (!name) return toast("Введи назву категорії");
  try { await api("/api/categories", { method: "POST", body: { name } }); reRun(); }
  catch (e) { toast(e.message); }
}

function setQty(n) { document.getElementById("qty").value = n; }
function stepQty(d) {
  const el = document.getElementById("qty");
  el.value = Math.max(1, (parseInt(el.value, 10) || 1) + d);
}

async function changeStock(itemId, sign) {
  const qty = parseInt(document.getElementById("qty").value, 10);
  const reason = (document.getElementById("reason").value || "").trim();
  if (!qty || qty < 1) return toast("Вкажи кількість");
  try {
    const body = { delta: sign * qty };
    if (sign < 0 && reason) body.reason = reason;   // причина необов'язкова
    await api(`/api/items/${itemId}/qty`, { method: "POST", body });
    reRun();
  } catch (e) { toast(e.message); }
}

async function adminReq(path, method = "POST", body) {
  try { await api(path, { method, body }); reRun(); }
  catch (e) { toast(e.message); }
}
function removeUser(id, nameEnc) {
  confirmAction(`Видалити ${decodeURIComponent(nameEnc)}? Користувач втратить доступ.`,
    () => adminReq(`/api/admin/users/${id}`, "DELETE"));
}

/* ---------- Картки ---------- */
function itemCard(it) {
  const q = Number(it.quantity ?? 0);
  return `<div class="card" onclick="go('item', ${Number(it.id)})">
      <div>
        <div class="title">${esc(it.name)}</div>
        ${it.category ? `<div class="sub">${esc(it.category)}</div>` : ""}
        ${it.used_on ? `<div class="sub">🔧 ${esc(it.used_on)}</div>` : ""}
      </div>
      <span class="qty-badge ${q <= 4 ? "qty-low" : ""}">${q}</span>
    </div>`;
}
const list = (arr, empty) => arr.length ? arr.map(itemCard).join("") : `<div class="center">${empty}</div>`;

/* ---------- Екрани ---------- */
route("menu", async () => {
  const profile = `<div class="profile">${avatar(ME.user_id, ME.username, 48)}
    <div><div class="title">${esc(ME.username)}</div>
    <div class="hint">${esc(ROLE_LABELS[ME.role] || ME.role)}</div></div></div>`;
  if (ME.status === "pending") {
    render(topbar("📦 Склад", false) + profile + `<p class="hint">Твій акаунт ще очікує підтвердження адміністратора.</p>`);
    return;
  }
  if (ME.status === "removed") {
    render(topbar("📦 Склад", false) + `<p class="hint">Доступ закрито адміністратором.</p>`);
    return;
  }
  render(`
    ${topbar("📦 Склад", false)}
    ${profile}
    <button class="menu-btn" onclick="go('categories')">📦 Товари</button>
    <button class="menu-btn" onclick="go('search')">🔍 Пошук</button>
    <button class="menu-btn" onclick="go('deficit')">📚 Залишки (дефіцит)</button>
    <button class="menu-btn" onclick="go('boxes')">📦 Boxes</button>
    <button class="menu-btn" onclick="go('scan')">📷 Сканувати QR</button>
    ${canUsers() ? `<button class="menu-btn" onclick="go('admin')">⚙️ Адмінка</button>` : ""}
  `);
});

route("categories", async () => {
  render(topbar("📦 Категорії", true) + LOADING);
  const cats = await api("/api/categories");
  render(
    topbar("📦 Категорії", true) +
    (cats.length ? "" : `<div class="center">Категорій ще немає</div>`) +
    cats.map(c => `<div class="card" onclick="go('items','${encodeURIComponent(c)}')">
        <span class="title">${esc(c)}</span><span>›</span></div>`).join("") +
    (canEdit() ? `<div style="margin-top:14px">
        <input type="text" id="newcat" placeholder="Нова категорія">
        <button class="btn" onclick="createCategory()">+ Додати категорію</button></div>` : "")
  );
});

route("items", async (catEnc) => {
  const cat = decodeURIComponent(catEnc);
  render(topbar(esc(cat), true) + LOADING);
  const items = await api(`/api/items?category=${catEnc}`);
  render(topbar(esc(cat), true) + list(items, "Товарів немає"));
});

route("item", async (id) => {
  render(topbar("Товар", true) + LOADING);
  const it = await api(`/api/items/${id}`);
  let reasons = [];
  try { reasons = await api("/api/reasons"); } catch (e) {}
  const usage = it.usage || [], boxes = it.boxes || [], hist = it.history || [];
  render(
    topbar(esc(it.name), true) +
    `<div class="card" style="cursor:default; display:block">
       <div class="sub">${esc(it.category)}</div>
       <div class="title" style="margin:6px 0 4px">Усього на складі: <b>${Number(it.quantity)}</b></div>
       ${boxes.length ? `<div class="sub">Вільно поза боксами: ${Number(it.free)}</div>` : ""}

       <div class="row" style="margin-top:12px; flex-wrap:nowrap">
         <button class="round-btn" onclick="stepQty(-1)">−</button>
         <input type="number" id="qty" value="1" min="1" inputmode="numeric" style="margin:0; text-align:center">
         <button class="round-btn" onclick="stepQty(1)">+</button>
       </div>
       <div class="chips">${[5, 10, 20, 50].map(n => `<button class="chip" onclick="setQty(${n})">${n}</button>`).join("")}</div>

       <input type="text" id="reason" list="reasons-list" placeholder="Куди списали (машина, необов'язково)">
       <datalist id="reasons-list">${reasons.map(r => `<option value="${esc(r)}">`).join("")}</datalist>
       <div class="row" style="flex-wrap:nowrap">
         <button class="btn danger" style="flex:1" onclick="changeStock(${Number(it.id)}, -1)">− Списати</button>
         ${canAdd() ? `<button class="btn" style="flex:1" onclick="changeStock(${Number(it.id)}, 1)">+ Додати</button>` : ""}
       </div>
     </div>` +
    (boxes.length
      ? `<h3>📦 У боксах</h3>` + boxes.map(b =>
          `<span class="pill link" onclick="go('box', ${Number(b.id)})">${esc(b.name)} · ${Number(b.quantity)} шт</span>`).join("")
      : "") +
    (usage.length
      ? `<h3>🔧 Використовували на</h3>` + usage.map(u =>
          `<span class="pill">${esc(u.reason)} · ${Number(u.total)} шт</span>`).join("")
      : "") +
    (hist.length
      ? `<h3>Історія</h3>` + hist.map(h =>
          `<div class="history-item">${h.action === "inc" ? "＋" : "−"}${Number(h.qty)} · ${fmtDate(h.date)}
           ${h.username ? " · " + esc(h.username) : ""}${h.reason ? " · " + esc(h.reason) : ""}</div>`).join("")
      : "")
  );
});

route("search", async () => {
  render(topbar("🔍 Пошук", true) +
    `<input type="text" id="q" placeholder="Назва товару або машини" oninput="doSearch()" autofocus>
     <div id="results"></div>`);
});

let searchTimer = null;
function doSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = document.getElementById("q"), box = document.getElementById("results");
    if (!q || !box) return;
    const text = q.value.trim();
    if (!text) { box.innerHTML = ""; return; }
    try {
      const items = await api(`/api/search?q=${encodeURIComponent(text)}`);
      box.innerHTML = list(items, "Нічого не знайдено");
    } catch (e) { toast(e.message); }
  }, 300);
}

route("deficit", async () => {
  render(topbar("📚 Дефіцит", true) + LOADING);
  const items = await api("/api/deficit");
  render(topbar("📚 Дефіцит", true) + list(items, "Дефіциту немає 🎉"));
});

route("boxes", async () => {
  render(topbar("📦 Boxes", true) + LOADING);
  const boxes = await api("/api/boxes");
  render(topbar("📦 Boxes", true) + (boxes.length ? boxes.map(b =>
    `<div class="card" onclick="go('box', ${Number(b.id)})">
       <div><div class="title">${esc(b.name)}</div><div class="sub">${Number(b.item_count)} поз.</div></div>
       <span>›</span></div>`).join("") : `<div class="center">Боксів немає</div>`));
});

route("box", async (id) => {
  render(topbar("Box", true) + LOADING);
  const b = await api(`/api/boxes/${id}`);
  render(topbar(esc(b.name), true) +
    (b.items.length ? b.items.map(x => {
      const q = Number(x.quantity);
      return `<div class="card" onclick="go('item', ${Number(x.item_id)})">
        <div>
          <div class="title">${esc(x.name)}</div>
          <div class="sub">${esc(x.category)}</div>
          <div class="sub">У боксі: ${q} · Усього на складі: ${Number(x.total_quantity)}</div>
        </div>
        <span class="qty-badge ${q <= 4 ? "qty-low" : ""}">${q}</span>
      </div>`;
    }).join("") : `<div class="center">Бокс порожній</div>`));
});

route("scan", async () => {
  if (!tg.showScanQrPopup) return toast("Сканер QR доступний тільки в Telegram");
  tg.showScanQrPopup({ text: "Наведи камеру на QR" }, (text) => {
    const m = /^(item|box)_(\d+)$/.exec(String(text).trim());   // формат QR з бекенду: item_7 / box_3
    if (!m) return false;                                      // не наш QR — скануємо далі
    go(m[1], Number(m[2]));
    return true;
  });
});

route("logs", async (limit = 100) => {
  render(topbar("🧾 Історія операцій", true) + LOADING);
  const rows = await api(`/api/admin/logs?limit=${limit}`);
  render(topbar("🧾 Історія операцій", true) +
    (rows.length ? rows.map(l => `
      <div class="card" style="cursor:default; display:block">
        <div class="title">${l.action === "inc" ? "＋" : "−"}${Number(l.qty)} · ${esc(l.item_name || "видалений товар")}</div>
        <div class="sub">👤 ${esc(l.username || l.user_id)} · ${fmtDate(l.date)}</div>
        ${l.reason ? `<div class="sub">📝 ${esc(l.reason)}</div>` : ""}
        ${l.box_name ? `<div class="sub">📦 ${esc(l.box_name)}</div>` : ""}
      </div>`).join("") : `<div class="center">Операцій ще немає</div>`) +
    (rows.length >= limit && limit < 500
      ? `<button class="btn" onclick="run('logs', [${limit + 100}], false)">Показати ще</button>` : ""));
});

route("admin", async () => {
  render(topbar("⚙️ Адмінка", true) + LOADING);
  const users = await api("/api/admin/users");
  const roleOptions = Object.keys(ROLE_LABELS).filter(r => r !== "admin" || ME.role === "admin");
  render(topbar("⚙️ Адмінка", true) +
    `<button class="menu-btn" onclick="go('logs')">🧾 Історія операцій</button>
     <h3>Користувачі</h3>` +
    users.map(u => {
      const mine = u.user_id === ME.user_id;
      const locked = u.role === "admin" && ME.role !== "admin";   // Зав складу не чіпає адміна
      const nameEnc = encodeURIComponent(u.username || u.user_id);
      const controls = (mine || locked) ? "" : `
        <div class="row" style="margin-top:8px">
          <select onchange="adminReq('/api/admin/users/${Number(u.user_id)}/role', 'POST', {role: this.value})">
            ${roleOptions.map(r => `<option value="${r}" ${u.role === r ? "selected" : ""}>${esc(ROLE_LABELS[r])}</option>`).join("")}
          </select>
          ${u.status === "pending" ? `
            <button class="btn small" onclick="adminReq('/api/admin/approve/${Number(u.user_id)}')">Підтвердити</button>
            <button class="btn small danger" onclick="adminReq('/api/admin/reject/${Number(u.user_id)}')">Відхилити</button>`
          : `<button class="btn small danger" onclick="removeUser(${Number(u.user_id)}, '${nameEnc}')">Видалити</button>`}
        </div>`;
      return `<div class="card" style="cursor:default; align-items:flex-start">
        ${avatar(u.user_id, u.username, 44)}
        <div style="flex:1">
          <div class="title">${esc(u.username || u.user_id)}
            ${u.status === "pending" ? `<span class="pill">очікує</span>` : ""}</div>
          <div class="sub">${esc(ROLE_LABELS[u.role] || u.role)}</div>
          ${controls}
        </div></div>`;
    }).join(""));
});

/* ---------- Старт ---------- */
(async function init() {
  try {
    ME = await api("/api/me");
  } catch (e) {
    render(`<div class="center">Не вдалося підключитися до сервера.<br>
      <span class="hint">${esc(e.message)}</span><br><br>
      <button class="btn" onclick="location.reload()">Спробувати ще</button></div>`);
    return;
  }
  go("menu");
})();
</script>
</body>
</html>
