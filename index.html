<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Склад</title>
<script src="https://telegram.org"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { padding: 12px 14px 90px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 14px; }
  .card {
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .card .title { font-size: 15px; }
  .card .sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .menu-btn {
    display: block; width: 100%; text-align: left;
    background: var(--secondary-bg); color: var(--text);
    border: none; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 8px;
    font-size: 15px; cursor: pointer;
  }
  .qty-badge {
    font-weight: 600; font-size: 14px;
    padding: 2px 10px; border-radius: 10px;
    background: var(--bg);
  }
  .qty-low { color: #e0433a; }
  .row { display: flex; align-items: center; gap: 10px; }
  .btn {
    background: var(--button); color: var(--button-text);
    border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 15px; cursor: pointer;
  }
  .btn.secondary { background: var(--secondary-bg); color: var(--text); }
  .btn.danger { background: #e0433a; color: #fff; }
  .btn:disabled { opacity: .5; }
  .round-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: none; background: var(--button); color: var(--button-text);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--hint); background: var(--bg); color: var(--text);
    font-size: 15px; margin-bottom: 10px;
  }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topbar .back { cursor: pointer; font-size: 20px; color: var(--link); }
  .hint { color: var(--hint); font-size: 13px; }
  .history-item { font-size: 13px; color: var(--hint); border-top: 1px solid var(--secondary-bg); padding: 6px 0; }
  .center { text-align: center; padding: 40px 0; color: var(--hint); }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 8px; background: var(--secondary-bg); margin-left: 6px; }
</style>
</head>
<body>
<div id="app"><div class="center">Завантаження…</div></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ---------------------------------------------------------------------
// НАЛАШТУВАННЯ: URL вашого бекенду на PythonAnywhere
// ---------------------------------------------------------------------
const API_BASE = window.SKLAD_API_BASE || "https://Valetnyn.pythonanywhere.com";

const initData = tg.initData || "";

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(API_BASE + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": initData,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res;
}

let ME = null;
const app = document.getElementById("app");

function render(html) { app.innerHTML = html; }

function topbar(title, backTo) {
  return `<div class="topbar">
    ${backTo ? `<span class="back" onclick="go('${backTo}')">←</span>` : ""}
    <h1 style="margin:0">${title}</h1>
  </div>`;
}

function toast(msg) {
  if (tg.showAlert) tg.showAlert(msg); else alert(msg);
}

// Variables to keep track of current navigation state for reRun()
let lastRouteName = "menu";
let lastRouteArgs = [];

// ---------------------------------------------------------------------
// РОУТИНГ (збереження стану для reRun)
// ---------------------------------------------------------------------
const routes = {};
function route(name, fn) { routes[name] = fn; }

async function go(name, ...args) {
  try {
    // Не запам'ятовуємо суто технічні екрани (сканер, показ QR), щоб логіка повернення не ламалась
    if (name !== "scan" && name !== "item") {
      lastRouteName = name;
      lastRouteArgs = args;
    }
    await routes[name](...args);
  } catch (e) {
    toast("Помилка: " + e.message);
  }
}

// Після зміни кількості прямо в списку просто перезавантажуємо той самий
// екран (категорію / пошук / дефіцит), на якому користувач зараз перебуває.
async function changeQty(itemId, delta) {
  try {
    await api(`/api/items/${itemId}/qty`, { method: "POST", body: { delta } });
    reRun();
  } catch (e) {
    toast(e.message);
  }
}
function reRun() { go(lastRouteName, ...lastRouteArgs); }

// ---------------------------------------------------------------------
// ГОЛОВНЕ МЕНЮ
// ---------------------------------------------------------------------
route("menu", async () => {
  render(`
    ${topbar("📦 Склад")}
    <button class="menu-btn" onclick="go('categories')">📦 Товари</button>
    <button class="menu-btn" onclick="go('search')">🔍 Пошук</button>
    <button class="menu-btn" onclick="go('deficit')">📚 Залишки (дефіцит)</button>
    <button class="menu-btn" onclick="go('boxes')">📦 Boxes</button>
    <button class="menu-btn" onclick="go('scan')">📷 Сканувати QR</button>
    ${ME && ME.role === "admin" ? `<button class="menu-btn" onclick="go('admin')">⚙️ Адмінка</button>` : ""}
    ${ME && ME.status === "pending" ? `<p class="hint">Твій акаунт ще очікує підтвердження адміністратора.</p>` : ""}
  `);
});

// ---------------------------------------------------------------------
// КАТЕГОРІЇ → ТОВАРИ
// ---------------------------------------------------------------------
route("categories", async () => {
  render(topbar("Категорії", "menu") + `<div class="center">Завантаження…</div>`);
  const cats = await api("/api/categories");
  render(
    topbar("📦 Категорії", "menu") +
    cats.map(c => `<div class="card" onclick="go('items','${encodeURIComponent(c)}')">
        <span class="title">${c}</span><span>›</span>
      </div>`).join("") +
    (ME && ME.role === "admin" ? `
      <div style="margin-top:14px">
        <input type="text" id="newcat" placeholder="Нова категорія">
        <button class="btn" onclick="createCategory()">+ Додати категорію</button>
      </div>` : "")
  );
});

async function createCategory() {
  const name = document.getElementById("newcat").value.trim();
  if (!name) return;
  await api("/api/categories", { method: "POST", body: { name } });
  go("categories");
}

route("items", async (categoryEnc) => {
  const category = decodeURIComponent(categoryEnc);
  render(topbar(category, "categories") + `<div class="center">Завантаження…</div>`);
  const items = await api("/api/items?category=" + encodeURIComponent(category));
  render(
    topbar(category, "categories") +
    (items.length ? items.map(itemRow).join("") : `<p class="hint">Товарів у цій категорії ще нема.</p>`) +
    (ME && ME.role === "admin" ? `
      <div style="margin-top:14px">
        <input type="text" id="newitem" placeholder="Назва нового товару">
        <button class="btn" onclick="createItem('${categoryEnc}')">+ Додати товар</button>
      </div>` : "")
  );
});

function itemRow(i) {
  const low = i.quantity <= 5 ? "qty-low" : "";
  return `<div class="card">
    <span class="title" style="cursor:pointer" onclick="go('item',${i.id})">${i.name}</span>
    <div class="row">
      <button class="round-btn" onclick="event.stopPropagation(); changeQty(${i.id}, -1)">−</button>
      <span class="qty-badge ${low}">${i.quantity}</span>
      <button class="round-btn" onclick="event.stopPropagation(); changeQty(${i.id}, 1)">+</button>
    </div>
  </div>`;
}

async function createItem(categoryEnc) {
  const name = document.getElementById("newitem").value.trim();
  if (!name) return;
  await api("/api/items", { method: "POST", body: { name, category: decodeURIComponent(categoryEnc) } });
  go("items", categoryEnc);
}

// ---------------------------------------------------------------------
// КАРТКА ТОВАРУ
// ---------------------------------------------------------------------
route("item", async (id) => {
  render(topbar("Товар", "menu") + `<div class="center">Завантаження…</div>`);
  const item = await api(`/api/items/${id}`);
  render(`
    ${topbar(item.name, "categories")}
    <div class="row" style="justify-content:center; gap:20px; margin:20px 0">
      <button class="round-btn" style="width:48px;height:48px;font-size:26px" onclick="bumpAndReload(${id},-1)">−</button>
      <span class="qty-badge" style="font-size:22px">${item.quantity}</span>
      <button class="round-btn" style="width:48px;height:48px;font-size:26px" onclick="bumpAndReload(${id},1)">+</button>
    </div>
    <div class="row" style="justify-content:center; gap:10px; margin-bottom:16px">
      <button class="btn secondary" onclick="showQr('item', ${id})">📎 QR-код</button>
${ME && ME.role === "admin" ? <button class="btn danger" onclick="deleteItem(${id})">🗑 Видалити</button> : ""}

Історія
${item.history && item.history.length ? item.history.map(h =>
<div class="history-item">${h.date} · ${h.username} · ${h.action === "inc" ? "+" : "-"}${h.qty}</div>
).join("") : <p class="hint">Поки що немає записів</p>}
`);
});
async function bumpAndReload(id, delta) {
try {
await api(/api/items/${id}/qty, { method: "POST", body: { delta } });
go("item", id);
} catch (e) { toast(e.message); }
}
async function deleteItem(id) {
if (!confirm("Видалити товар?")) return;
await api(/api/items/${id}, { method: "DELETE" });
go("categories");
}
// ---------------------------------------------------------------------
// ПОШУК
// ---------------------------------------------------------------------
route("search", async () => {
render(${topbar("🔍 Пошук", "menu")} <input type="text" id="q" placeholder="Назва товару…" oninput="doSearch()"> <div id="results"></div>);
document.getElementById("q").focus();
});
let searchTimer;
async function doSearch() {
clearTimeout(searchTimer);
searchTimer = setTimeout(async () => {
const q = document.getElementById("q").value.trim();
const box = document.getElementById("results");
if (!q) { box.innerHTML = ""; return; }
const items = await api("/api/search?q=" + encodeURIComponent(q));
box.innerHTML = items.length
? items.map(itemRow).join("")
: <p class="hint">Нічого не знайдено</p>;
}, 300);
}
// ---------------------------------------------------------------------
// ДЕФІЦИТ
// ---------------------------------------------------------------------
route("deficit", async () => {
render(topbar("📚 Дефіцит (≤5 шт)", "menu") + <div class="center">Завантаження…</div>);
const items = await api("/api/deficit");
render(
topbar("📚 Дефіцит (≤5 шт)", "menu") +
(items.length ? items.map(itemRow).join("") : <p class="hint">Дефіциту немає 🎉</p>)
);
});
// ---------------------------------------------------------------------
// BOXES
// ---------------------------------------------------------------------
route("boxes", async () => {
render(topbar("📦 Boxes", "menu") + <div class="center">Завантаження…</div>);
const boxes = await api("/api/boxes");
render(
topbar("📦 Boxes", "menu") +
boxes.map(b => <div class="card" onclick="go('box',${b.id})"> <span class="title">${b.name}</span><span>›</span> </div>).join("") +
(ME && ME.role === "admin" ?  <div style="margin-top:14px"> <input type="text" id="newbox" placeholder="Назва нового box"> <button class="btn" onclick="createBox()">+ Створити box</button> </div> : "")
);
});
async function createBox() {
const name = document.getElementById("newbox").value.trim();
if (!name) return;
await api("/api/boxes", { method: "POST", body: { name } });
go("boxes");
}
route("box", async (id) => {
render(topbar("Box", "boxes") + <div class="center">Завантаження…</div>);
const box = await api(/api/boxes/${id});
const allItems = ME && ME.role === "admin" ? await api("/api/items") : [];
render(${topbar(box.name, "boxes")} ${box.items && box.items.length ? box.items.map(i =>${i.name}${i.quantity}).join("") :У цьому box поки нема товарів} <div class="row" style="margin-top:14px; gap:10px"> <button class="btn secondary" onclick="showQr('box', ${id})">📎 QR-код</button> ${ME && ME.role === "admin" ? 🗑 Видалити box: ""} </div> ${ME && ME.role === "admin" ?
Додати товар у box

${allItems.map(i => <option value="${i.id}">${i.name}</option>).join("")}


+ Додати
: ""});
});
async function addItemToBox(boxId) {
const item_id = parseInt(document.getElementById("box-item-select").value, 10);
const quantity = parseInt(document.getElementById("box-item-qty").value, 10) || 0;
await api(/api/boxes/${boxId}/items, { method: "POST", body: { item_id, quantity } });
go("box", boxId);
}
async function deleteBox(id) {
if (!confirm("Видалити box?")) return;
await api(/api/boxes/${id}, { method: "DELETE" });
go("boxes");
}
// ---------------------------------------------------------------------
// QR: показ (для товару/box) і сканування (нативним сканером Telegram)
// ---------------------------------------------------------------------
async function showQr(kind, id) {
const url = ${API_BASE}/api/${kind === "item" ? "items" : "boxes"}/${id}/qr;
const res = await fetch(url, { headers: { "X-Telegram-Init-Data": initData } });
const blob = await res.blob();
const imgUrl = URL.createObjectURL(blob);
render(<div class="topbar"> <span class="back" onclick="go('${kind}', ${id})">←</span> <h1 style="margin:0">QR-код</h1> </div> <div class="center"><img src="${imgUrl}" style="width:220px;height:220px"></div>);
}
route("scan", async () => {
if (!tg.showScanQrPopup) {
render(topbar("Сканування", "menu") + <p class="hint">Телеграм-клієнт не підтримує сканер QR (онови застосунок Telegram).</p>);
return;
}
tg.showScanQrPopup({ text: "Наведи камеру на QR-код товару або box" }, (text) => {
tg.closeScanQrPopup();
const m = /^item_(\d+)$/.exec(text) || /^box_(\d+)$/.exec(text);
if (!m) { toast("Невідомий QR-код"); return; }
if (text.startsWith("item_")) go("item", parseInt(m[1], 10));
else go("box", parseInt(m[1], 10));
});
render(topbar("Сканування", "menu") + <p class="hint">Відкрито сканер Telegram…</p>);
});
// ---------------------------------------------------------------------
// АДМІНКА
// ---------------------------------------------------------------------
route("admin", async () => {
render(topbar("⚙️ Адмінка", "menu") + <div class="center">Завантаження…</div>);
const [pending, users] = await Promise.all([
api("/api/admin/pending"),
api("/api/admin/users"),
]);
render(${topbar("⚙️ Адмінка", "menu")} <h3>⏳ Очікують підтвердження</h3> ${pending.length ? pending.map(u =>

${u.username}

✅
❌


).join("") : Немає користувачів в очікуванні`}
👥 Всі користувачі
${users.length ? users.map(u => <div class="card"> <span class="title">${u.username} <span class="pill">${u.role}</span></span> </div>).join("") : <p class="hint">Список порожній</p>}
`);
});
async function approveUser(userId) {
await api(/api/admin/users/${userId}/approve, { method: "POST" });
go("admin");
}
async function rejectUser(userId) {
if (!confirm("Відхилити запит користувача?")) return;
await api(/api/admin/users/${userId}/reject, { method: "POST" });
go("admin");
}
// ---------------------------------------------------------------------
// СТАРТ ПРОГРАМИ
// ---------------------------------------------------------------------
async function init() {
try {
ME = await api("/api/me");
go("menu");
} catch (e) {
toast("Помилка авторизації бекенду: " + e.message);
// Для тестів, якщо сервер вимкнено, можна розкоментувати рядок нижче:
// ME = { role: "admin", status: "active" }; go("menu");
}
}
init();
