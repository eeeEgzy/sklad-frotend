<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Бота</title>
    <!-- Правильне підключення Telegram скрипта -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Тестова сторінка Mini App</h1>
    <p id="user-info">Очікування даних від Telegram...</p>
    <button id="btn" onclick="testClick()">Перевірити роботу</button>

    <script>
        // Ініціалізація Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Спробуємо вивести ім'я користувача на екран
        const infoParagraph = document.getElementById("user-info");
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            infoParagraph.innerText = `Привіт, ${user.first_name} ${user.last_name || ''} (@${user.username || 'немає'})!`;
        } else {
            infoParagraph.innerText = "Додаток запущено поза Telegram або дані користувача недоступні.";
        }

        // Функція для кнопки
        function testClick() {
            tg.showAlert("Чудово! Telegram скрипт працює і реагує на дії!");
        }
    </script>
</body>
</html>
