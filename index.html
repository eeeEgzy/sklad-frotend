<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<title>Склад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Світла тема примусово: чорний текст на білому, незалежно від теми Telegram/браузера */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #111111;
    --hint: #6b6b73;
    --link: #111111;
    --button: #111111;
    --button-text: #ffffff;
    --secondary-bg: #f2f2f5;
    --border: #c8c8d0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { padding: 12px 14px 90px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 14px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  .card {
    background: var(--secondary-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .card.click {
    cursor: pointer;
}
.card.click:active {
    transform: scale(0.97);
    opacity: 0.9;
}
.card-main {
    flex: 1;
}
.card .title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
}
.card .sub {
    font-size: 13px;
    color: var(--hint);
    margin-top: 3px;
}
  .menu-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    background: var(--secondary-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .menu-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }
  .menu-btn.admin-btn {
    background: #fdf1f0;
    border: 1px solid rgba(224, 67, 58, 0.5);
  }
  .st { display:inline-block; padding:3px 9px; border-radius:10px; font-size:13px; font-weight:600; white-space:nowrap; }
  .st-work { background:#1f7a3d; color:#fff; }
  .st-maintenance { background:#2f6fed; color:#fff; }
  .st-repair { background:#c0392b; color:#fff; }
  .st-line_down { background:#e8710a; color:#fff; }
  .st-planned { background:#f5c518; color:#111; }
  .warn-legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--hint); margin:0 0 12px; }
  .warn-legend span { display:inline-flex; align-items:center; gap:4px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .chips .btn { white-space:nowrap; flex:0 0 auto; }
  .history.reverted { opacity: .55; }
  .history.reverted b { text-decoration: line-through; }
  .filters { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:10px; }
  .filters .full { grid-column: 1 / -1; }
  .qrgrid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  .qrcard { background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px; text-align:center; font-size:13px; font-weight:600; }
  .qrcard img { width:100%; max-width:150px; display:block; margin:0 auto 4px; }
  .chk { display:flex; gap:14px; align-items:flex-start; margin:16px 0; cursor:pointer; }
  .chk.off { opacity:.5; cursor:default; }
  .chk input[type="checkbox"] { width:26px; height:26px; min-height:0; padding:0; margin:2px 0 0; flex:none; accent-color:#1f7a3d; }
  .chk b { font-size:15px; }
  .chk small { color:var(--hint); font-size:13px; line-height:1.35; }
  .card.unitmode { outline: 2px solid #2f6fed; }
  .card.deleting { outline: 2px solid #e0433a; color: #e0433a; }
  .btn:active { opacity: .85; }
  input::placeholder, textarea::placeholder { color: #9a9aa3; -webkit-text-fill-color: #9a9aa3; }
  select option { background: #ffffff; color: #111111; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--bg); color: var(--text); border-radius: 14px; padding: 16px; width: 100%; max-width: 420px; }
  .modal h2 { margin-top: 0; }
  .modal { box-sizing: border-box; max-height: 90vh; overflow-y: auto; overflow-x: hidden; }
  .modal input, .modal select, .modal textarea { max-width: 100%; min-width: 0; box-sizing: border-box; }
  /* iOS розтягує поля дати/часу за межі вікна — тримаємо їх у ширину контейнера */
  input[type="datetime-local"], input[type="date"], input[type="time"] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box;
    min-height: 46px; line-height: 1.2; text-align: left;
  }
  input[type="datetime-local"]::-webkit-date-and-time-value,
  input[type="date"]::-webkit-date-and-time-value,
  input[type="time"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; margin: 0; }
  input[type="datetime-local"]::-webkit-datetime-edit,
  input[type="date"]::-webkit-datetime-edit { padding: 0; }
  .qty, .qty-badge {
    font-weight: 600; font-size: 14px;
    padding: 4px 10px; border-radius: 10px;
    background: var(--bg); white-space: nowrap;
  }
  .qty.low, .qty-low { color: #e0433a; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--button); color: var(--button-text);
    border: none; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; cursor: pointer;
  }
  .btn.secondary { background: var(--secondary-bg); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: #ffffff; color: #111111; border: 1px solid #111111; }
  .btn:disabled { opacity: .5; }
  .form {
    background: var(--secondary-bg);
    border: 1px solid var(--border);
    padding: 12px 14px; border-radius: 12px; margin-top: 14px;
  }
  .form h2 { margin-top: 0; }
  label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 4px; }
  textarea { width:100%; box-sizing:border-box; min-height:90px; font:inherit; border-radius:10px; padding:10px 12px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; margin-bottom:10px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    -webkit-text-fill-color: var(--text); opacity: 1;
    font-size: 15px; margin-bottom: 10px;
  }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .topbar .back { cursor: pointer; font-size: 22px; color: var(--link); padding: 2px 6px; }
  .hint { color: var(--hint); font-size: 13px; margin: 6px 0 12px; }
  .history, .history-item {
    font-size: 13px; color: var(--text);
    background: var(--secondary-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; line-height: 1.4;
  }
  .center { text-align: center; padding: 40px 0; color: var(--hint); }
  .empty { text-align: center; padding: 24px 0; color: var(--hint); font-size: 14px; }
  .video { width: 100%; max-height: 260px; background: #000; border-radius: 12px; margin-bottom: 10px; object-fit: cover; }
  .qr { display: block; max-width: 220px; margin: 12px auto 4px; border-radius: 10px; }
  .avatar { position: relative; flex: none; border-radius: 50%; overflow: hidden; background: var(--button); color: var(--button-text); display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .avatar img.on { display: block; }
</style>
</head>
<body>
<div id="app"><div class="center">Завантаження…</div></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try {
    if (tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
      tg.setHeaderColor("#ffffff");
      tg.setBackgroundColor("#ffffff");
      if (tg.setBottomBarColor) tg.setBottomBarColor("#ffffff");
    }
  } catch (_e) {}
}

const API_BASE = window.SKLAD_API_BASE || "https://Valetnyn.pythonanywhere.com";
const initData = (tg && tg.initData) ? tg.initData : "";

let ME = null;
const app = document.getElementById("app");

// Нативна кнопка «Назад» у шапці Telegram (замість хрестика)
const HAS_TG_BACK = Boolean(tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1"));
let pendingBack = null;
let currentBack = null;

function syncBackButton() {
  currentBack = pendingBack;
  pendingBack = null;
  if (!HAS_TG_BACK) return;
  try {
    if (currentBack) tg.BackButton.show();
    else tg.BackButton.hide();
  } catch (_e) {}
}

if (HAS_TG_BACK) {
  tg.BackButton.onClick(() => {
    if (currentBack) go(currentBack);
  });
}

function render(html) {
  app.innerHTML = html;
  syncBackButton();
  hydratePhotos();
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function enc(str) {
  return encodeURIComponent(String(str ?? ""));
}

function isAdmin() {
  return Boolean(ME && ME.role === "admin");
}

function canAdd() {
  return ["admin", "manager", "editor", "assistant"].includes(ME?.role);
}

function canUsers() {
  return ["admin", "manager"].includes(ME?.role);
}

function canEquip() {
  return ["admin", "manager", "editor"].includes(ME?.role);
}

function canUndo() {
  return canEdit();
}

function canEdit() {
  return ["admin", "manager", "editor", "assistant"].includes(ME?.role);
}

function formField(labelText, id, type = "text", defaultVal = "") {
  return `<label for="${esc(id)}">${esc(labelText)}</label><input type="${esc(type)}" id="${esc(id)}" value="${esc(defaultVal)}">`;
}

function itemCard(i, showCategory = true) {
  return `<div class="card click" onclick="go('item', ${Number(i.id)})">
    <div class="card-main">
      <div class="title">${esc(i.name)}</div>
      ${showCategory ? `<div class="sub">${esc(i.category || "")}</div>` : ""}
    </div>
    <span class="qty ${i.quantity <= (i.min ?? 4) ? "low" : ""}">${i.quantity} ${uLabel(i.unit)}</span>
  </div>`;
}

function topbar(title, backTo = "menu") {
  pendingBack = backTo || null;
  return `<div class="topbar">
    ${backTo && !HAS_TG_BACK ? `<span class="back" onclick="go('${esc(backTo)}')">←</span>` : ""}
    <h1 style="margin:0">${esc(title)}</h1>
  </div>`;
}

function toast(msg) {
  if (tg && tg.showAlert) {
    try { tg.showAlert(String(msg)); return; } catch (_e) {}
  }
  alert(String(msg));
}

function confirmDlg(msg) {
  return new Promise(resolve => {
    if (tg && typeof tg.showConfirm === "function" && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) {
      try { tg.showConfirm(String(msg), ok => resolve(Boolean(ok))); return; } catch (_e) {}
    }
    resolve(window.confirm(String(msg)));
  });
}

function askForm(title, fields) {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.className = "modal-overlay";
    ov.innerHTML = `<div class="modal"><h2>${esc(title)}</h2>` +
      fields.map(f => f.type === "select"
        ? `<label>${esc(f.label)}</label><select id="mf_${esc(f.id)}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`
        : f.type === "textarea"
        ? `<label>${esc(f.label)}</label><textarea id="mf_${esc(f.id)}" placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>`
        : `<label>${esc(f.label)}</label><input id="mf_${esc(f.id)}" type="${esc(f.type || "text")}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}" ${f.type === "number" ? 'inputmode="numeric" min="1"' : ""}>`).join("") +
      `<div class="row" style="flex-wrap:nowrap"><button class="btn secondary" style="flex:1" id="mf_cancel">Скасувати</button><button class="btn" style="flex:1" id="mf_ok">ОК</button></div></div>`;
    document.body.appendChild(ov);
    const close = v => { ov.remove(); resolve(v); };
    ov.querySelector("#mf_cancel").onclick = () => close(null);
    ov.querySelector("#mf_ok").onclick = () => {
      const out = {};
      fields.forEach(f => { out[f.id] = ov.querySelector("#mf_" + f.id).value; });
      close(out);
    };
  });
}

function openLink(url) {
  if (tg && typeof tg.openLink === "function") { tg.openLink(url); return false; }
  return true;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(API_BASE + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": initData,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText || `Помилка ${res.status}`;
    try {
      const errJson = await res.json();
      msg = errJson.detail || errJson.error || errJson.message || msg;
    } catch (_e) {}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res;
}

const ROLE_LABELS = { admin: "Адмін", manager: "Зав складу", editor: "Редактор", assistant: "Помічник складу", worker: "Працівник" };
const ROLE_COLORS = { admin: "#2481cc", manager: "#8e44ad", editor: "#388a34", assistant: "#16a0a0", worker: "#e09f3a" };

// одиниця виміру: «шт» показуємо з крапкою, м/см/мм — як є
function uLabel(u) {
  return !u || u === "шт" ? "шт." : esc(u);
}

function fmtDate(str) {
  const d = new Date(String(str).replace(" ", "T") + "Z");
  return isNaN(d) ? esc(str) : d.toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

const photoCache = {};
function avatar(uid, name, size) {
  const ch = esc(String(name || "?").trim().charAt(0).toUpperCase());
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px"><span>${ch}</span><img data-uid="${Number(uid)}" alt=""></div>`;
}
function hydratePhotos() {
  document.querySelectorAll("img[data-uid]").forEach(async img => {
    const uid = img.dataset.uid;
    if (!(uid in photoCache)) {
      photoCache[uid] = fetch(API_BASE + `/api/users/${uid}/photo`, { headers: { "X-Telegram-Init-Data": initData } })
        .then(r => (r.ok ? r.blob() : null))
        .then(b => (b ? URL.createObjectURL(b) : null))
        .catch(() => null);
    }
    const url = await photoCache[uid];
    if (url) { img.src = url; img.classList.add("on"); }
  });
}

let EQLIST = [];

function eqSelectHtml() {
  if (!EQLIST.length) return "";
  const groups = {};
  EQLIST.forEach(e => { const k = `${e.workshop} · ${e.line}`; (groups[k] = groups[k] || []).push(e); });
  return `<select id="eqsel"><option value="">На яке обладнання списали (необов’язково)</option>${Object.entries(groups).map(([k, arr]) => `<optgroup label="${esc(k)}">${arr.map(e => `<option value="${Number(e.id)}">${esc(e.name)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}

function itemControls(item, reasons) {
  return `<div class="form" style="margin-top:0">
    <input type="number" id="qty" value="1" min="1" inputmode="numeric" placeholder="Кількість">
    ${eqSelectHtml()}
    <input type="text" id="reason" list="reasons-list" placeholder="Примітка до списання (необов’язково)">
    <datalist id="reasons-list">${reasons.map(r => `<option value="${esc(r)}">`).join("")}</datalist>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn danger" style="flex:1" onclick="changeItemQty(${item.id}, -1)">− Списати</button>
      ${canAdd() ? `<button class="btn" style="flex:1" onclick="changeItemQty(${item.id}, 1)">＋ Поповнити</button>` : ""}
    </div>
    ${canEdit() ? `<button class="btn secondary" style="color:#e0433a;margin-top:10px" onclick="deleteItem(${item.id}, decodeURIComponent('${enc(item.category)}'))">🗑 Видалити товар</button>` : ""}
  </div>`;
}

let lastRouteName = "menu";
let lastRouteArgs = [];
const routes = {};

function route(name, fn) {
  routes[name] = fn;
}

async function go(name, ...args) {
  try {
    stopScanner();
    if (name === "previous") {
      return await routes[lastRouteName](...lastRouteArgs);
    }
    if (name !== "scan" && name !== "item") {
      lastRouteName = name;
      lastRouteArgs = args;
    }
    if (!routes[name]) throw new Error(`Маршрут "${name}" не знайдено`);
    await routes[name](...args);
  } catch (e) {
    toast("Помилка: " + e.message);
  }
}

// ================= МАРШРУТИ =================

// ================= ПРОФІЛЬ (імʼя та логін, заповнюється один раз) =================
function renderProfile(gate) {
  const done = ME && ME.profile_done;
  render(
    topbar(gate ? "👤 Заповни профіль" : "👤 Мій профіль", gate ? null : "menu") +
    `<p class="hint">${gate
      ? "Перед входом вкажи своє імʼя та логін. Це робиться один раз: дані збережуться, поки ти сам не вийдеш з профілю."
      : "Твої дані збережені. Адміністратор бачить їх, якщо ти забудеш логін."}</p>
     <div class="form">
       ${formField("Імʼя та прізвище", "pfname", "text", (ME && ME.full_name) || "")}
       ${formField("Логін для входу", "pflogin", "text", (ME && ME.login) || "")}
       <p class="hint">⚠️ Пароль тут не вказуй: зберігається лише імʼя та логін.</p>
       <button class="btn" style="width:100%" onclick="saveProfile(${gate ? "true" : "false"})">${gate ? "Зберегти й увійти" : "Зберегти"}</button>
       ${!gate && done ? `<button class="btn danger" style="width:100%;margin-top:10px" onclick="profileLogout()">Вийти з профілю</button>` : ""}
     </div>` + (gate ? "" : notifyBlockHtml())
  );
}

function notifyBlockHtml() {
  const list = (ME && ME.notify) || [];
  if (!list.length) return "";
  return `<h2>🔔 Сповіщення</h2><p class="hint">Оберіть, які сповіщення надсилати вам у Telegram.</p><div class="form">` +
    list.map(n => `<label class="chk ${n.available ? "" : "off"}"><input type="checkbox" id="nf_${esc(n.key)}" ${n.enabled ? "checked" : ""} ${n.available ? "" : "disabled"}><span><b>${esc(n.label)}</b><br><small>${n.available ? esc(n.desc) : "Доступно зав складу та адміну."}</small></span></label>`).join("") +
    `<button class="btn" style="width:100%;margin-top:6px" onclick="saveNotify()">Зберегти</button>
     <button class="btn secondary" style="width:100%;margin-top:8px" onclick="testNotify()">🔔 Надіслати тестове сповіщення</button>
     <p class="hint">Щоб сповіщення приходили, один раз відкрий чат із ботом і натисни Start.</p></div>`;
}

async function saveNotify() {
  const body = {};
  ((ME && ME.notify) || []).forEach(n => {
    const el = document.getElementById("nf_" + n.key);
    if (el && !el.disabled) body[n.key] = el.checked;
  });
  try {
    const r = await api("/api/profile/notifications", { method: "POST", body });
    ME.notify = r.notify;
    toast("Налаштування сповіщень збережено");
  } catch (e) {
    toast(e.message);
  }
}

async function testNotify() {
  try {
    await api("/api/profile/notifications/test", { method: "POST", body: {} });
    toast("Тестове сповіщення надіслано. Перевір чат із ботом.");
  } catch (e) {
    toast(e.message);
  }
}

route("profile", async () => {
  try { ME = await api("/api/me"); } catch (_e) {}
  renderProfile(false);
});

async function saveProfile(gate) {
  const full_name = document.getElementById("pfname").value.trim();
  const login = document.getElementById("pflogin").value.trim();
  if (full_name.length < 2) return toast("Вкажи імʼя та прізвище");
  if (login.length < 2) return toast("Вкажи логін");
  try {
    await api("/api/profile", { method: "POST", body: { full_name, login } });
    ME = await api("/api/me");
    toast("Профіль збережено");
    if (gate) return boot();
    go("menu");
  } catch (e) {
    toast(e.message);
  }
}

async function profileLogout() {
  if (!(await confirmDlg("Вийти з профілю? Імʼя та логін буде видалено, при наступному вході їх потрібно вписати знову."))) return;

async function fetchQrUrl(equipId) {

let cameraStream = null, scanLoop = false;
route("scan", async () => {
  render(
    topbar("Сканер QR", "menu") +
    `<p class="hint">Наведи камеру на QR-код обладнання. Якщо камера недоступна, введи код вручну (наприклад: eq_12).</p>
     <video id="camera" class="video" autoplay playsinline></video>
     <div class="row">
       <button class="btn" onclick="startScanner()">Увімкнути камеру</button>
       <button class="btn secondary" onclick="stopScanner()">Зупинити</button>
     </div>
     <div class="form">
       <label>Код обладнання</label>
       <input type="text" id="manualqr" placeholder="eq_12">
       <button class="btn" onclick="openScannedCode()">Відкрити картку</button>
     </div>
     <div id="scanstatus" class="hint"></div>`
  );
});

async function startScanner() {
  if (tg && typeof tg.showScanQrPopup === "function") {
    try {
      tg.showScanQrPopup({ text: "Наведіть камеру на QR-код обладнання" }, (text) => {
        const field = document.getElementById("manualqr");
        if (field) field.value = text;
        tg.closeScanQrPopup();
        openScannedCode();
        return true;
      });
      return;
    } catch (_e) {}
  }
  try {
    if (!("BarcodeDetector" in window)) {
      throw new Error("Вбудований QR-сканер недоступний. Введи код вручну або відкрий Mini App у Telegram.");
    }
    stopScanner();
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    const video = document.getElementById("camera");
    video.srcObject = cameraStream;
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    scanLoop = true;
    const tick = async () => {
      if (!scanLoop || !video || video.readyState < 2) return requestAnimationFrame(tick);
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          document.getElementById("manualqr").value = codes[0].rawValue;
          stopScanner();
          openScannedCode();
          return;
        }
      } catch (_e) {}
      requestAnimationFrame(tick);
    };
    video.onloadedmetadata = () => video.play().then(tick);
  } catch (e) {
    toast(e.message || "Не вдалося запустити камеру");
  }
}

function stopScanner() {
  scanLoop = false;
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById("camera");
  if (video) video.srcObject = null;
}

function openScannedCode() {
  const code = (document.getElementById("manualqr")?.value || "").trim();
  const match = code.match(/^(eq|item)_(\d+)$/i);
  if (!match) return toast("Невірний QR-код. Очікується код виду eq_12");
  stopScanner();
  go(match[1].toLowerCase() === "eq" ? "parts" : "item", Number(match[2]));
}

async function applyAudit() {
  const entries = [];
  let diffs = 0;
  document.querySelectorAll(".auditin").forEach(inp => {
    const v = inp.value.trim();
    if (v === "") return;
    const counted = parseInt(v, 10);
    if (!Number.isInteger(counted) || counted < 0) return;
    entries.push({ item_id: Number(inp.dataset.id), counted });
    if (counted !== Number(inp.dataset.exp)) diffs++;
  });
  if (!entries.length) return toast("Внеси хоча б одну кількість");
  if (!(await confirmDlg(`Перераховано позицій: ${entries.length}. Розбіжностей: ${diffs}. Виправити залишки в системі?`))) return;
  try {
    const r = await api("/api/audit/apply", { method: "POST", body: { scope: auditScope, items: entries } });
    renderAuditResult(r);
  } catch (e) {
    toast(e.message);
  }
}

  render(
    topbar("Результат ревізії", "audit") +

    (r.errors.length ? "<h2>Не вдалося виправити</h2>" + r.errors.map(e => `<div class="history" style="color:#e0433a">${esc(e)}</div>`).join("") : "") +

  );
}

// ================= ОБЛАДНАННЯ ТА ЛІНІЇ (бачать усі, змінюють — від редактора) =================
const EQ_STATUS = {
  work: ["Працює", "st-work", "🟢"],
  maintenance: ["Планове ТО", "st-maintenance", "🟡"],
  repair: ["Ремонт обладнання", "st-repair", "🔴"],
  line_down: ["Лінія не працює", "st-line_down", "⚫"],
};
const EQ_RANK = { work: 0, planned: 1, maintenance: 2, repair: 3, line_down: 4 };
// колір трикутника: [заливка, обводка, знак «!»]
const WARN_COLORS = {
  work: ["#2fa84f", "#1f7a3d", "#ffffff"],        // зелений — працює
  maintenance: ["#2f6fed", "#1d4fb8", "#ffffff"], // синій  — планове ТО
  planned: ["#f5c518", "#b38f00", "#111111"],     // жовтий — ТО/ремонт заплановано попереду
  repair: ["#e0433a", "#a82a22", "#ffffff"],      // червоний — ремонт
  line_down: ["#f2862b", "#b85f0b", "#ffffff"],   // оранжевий — лінія не працює
};

function warnIcon(kind, size = 16) {
  const c = WARN_COLORS[kind] || WARN_COLORS.work;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:-3px" aria-hidden="true"><path d="M12 3 L22.5 21 H1.5 Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.6" stroke-linejoin="round"/><rect x="11" y="9" width="2" height="6.5" rx="1" fill="${c[2]}"/><circle cx="12" cy="18" r="1.2" fill="${c[2]}"/></svg>`;
}

// що показувати біля лінії: поточний стан, а якщо все працює, але щось заплановано — жовтий
function healthKind(l) {
  if (l.health !== "work") return l.health;
  return (l.next || l.equipment.some(e => e.next)) ? "planned" : "work";
}

// біля цеху/лінії значок лише коли є що показати; якщо все працює — без значка
function chipIcon(kind) {
  return kind === "work" ? "" : warnIcon(kind) + " ";
}

function warnLegend() {
  const items = [["maintenance", "планове ТО"], ["planned", "заплановано"], ["repair", "ремонт"], ["line_down", "лінія не працює"]];
  return `<div class="warn-legend">${items.map(([k, t]) => `<span>${warnIcon(k, 14)} ${t}</span>`).join("")}</div>`;
}
let EQ = { workshops: [], workshop: "", lines: [], lineId: null, deleteMode: false };

function stBadge(st) {
  const s = EQ_STATUS[st] || EQ_STATUS.work;
  return `<span class="st ${s[1]}">${s[0]}</span>`;
}

function nowLocalInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

function eqRange(from, until) {
  return `${fmtDate(from)} → ${until ? fmtDate(until) : "без кінця"}`;
}

function curLine() {
  return EQ.lines.find(l => l.id === EQ.lineId);
}

function worstHealth(lines) {
  return lines.reduce((w, l) => (EQ_RANK[healthKind(l)] > EQ_RANK[w] ? healthKind(l) : w), "work");
}

route("equipment", async (lineId) => {
  render(topbar("🏭 Обладнання", "menu") + `<div class="center">Завантаження…</div>`);
  const data = await api("/api/equipment");
  EQ.lines = data.lines;
  EQ.workshops = data.workshops;
  if (lineId) {
    const l = EQ.lines.find(x => x.id === Number(lineId));
    if (l) { EQ.lineId = l.id; EQ.workshop = l.workshop; }
  }
  if (!EQ.workshops.includes(EQ.workshop)) EQ.workshop = EQ.workshops[0] || "";
  const inWs = EQ.lines.filter(l => l.workshop === EQ.workshop);
  if (!inWs.some(l => l.id === EQ.lineId)) EQ.lineId = inWs.length ? inWs[0].id : null;
  EQ.deleteMode = false;
  renderEquipment();
  loadEquipEvents();
});

function renderEquipment(typed = "") {
  const edit = canEquip();
  const inWs = EQ.lines.filter(l => l.workshop === EQ.workshop);
  const line = curLine();

  const wsChips = EQ.workshops.map((w, i) => {
    const h = worstHealth(EQ.lines.filter(l => l.workshop === w));
    return `<button class="btn ${w === EQ.workshop ? "" : "secondary"}" onclick="eqPickWorkshop(${i})">${chipIcon(h)}${esc(w)}</button>`;
  }).join("");
  const lineChips = inWs.map(l => `<button class="btn ${l.id === EQ.lineId ? "" : "secondary"}" onclick="eqPickLine(${Number(l.id)})">${chipIcon(healthKind(l))}${esc(l.name)}</button>`).join("");

  const addLineForm = edit
    ? `<div class="form"><h2>Лінії цеху «${esc(EQ.workshop)}»</h2>${formField("Назва нової лінії", "linename", "text", "")}<div class="row"><button class="btn" onclick="eqAddLine()">＋ Додати лінію</button>${line ? `<button class="btn danger" onclick="eqDeleteLine()">－ Видалити «${esc(line.name)}»</button>` : ""}</div></div>`
    : "";

  let body = "";
  if (!line) {
    body = `<div class="empty">У цьому цеху ще немає ліній</div>` + addLineForm;
  } else {
    const lineInfo = `<div class="card"><div class="card-main"><div class="title">${esc(line.workshop)} · ${esc(line.name)}</div><div class="sub">${line.status !== "work" ? eqRange(line.from, line.until) + (line.note ? " · " + esc(line.note) : "") : `Ремонт: ${Number(line.counts.repair)} · ТО: ${Number(line.counts.maintenance)}`}${line.next ? `<br>Далі: ${esc(EQ_STATUS[line.next.status][0])} з ${fmtDate(line.next.from)}` : ""}</div></div>${stBadge(line.status)}</div>` +
      (edit ? `<div class="row" style="margin-bottom:10px"><button class="btn" style="width:100%" onclick="eqMark(null)">⚙️ Позначити всю лінію</button></div>` : "") +
      `<div class="row" style="margin-bottom:10px"><button class="btn secondary" style="width:100%" onclick="go('eqqr', ${Number(line.id)})">📱 QR-коди обладнання лінії</button></div>`;
    const items = line.equipment.map(e => {
      const detail = (e.status !== "work" ? eqRange(e.from, e.until) + (e.source === "line" ? " (через лінію)" : "") + (e.note ? " · " + esc(e.note) : "") : "") +
        (e.next ? `${e.status !== "work" ? "<br>" : ""}Далі: ${esc(EQ_STATUS[e.next.status][0])} з ${fmtDate(e.next.from)}` : "");
      return `<div class="card ${edit ? "click" : ""} ${EQ.deleteMode ? "deleting" : ""}" ${edit ? `onclick="eqClick(${Number(e.id)})"` : ""}><div class="card-main"><div class="title">${esc(e.name)}</div>${detail ? `<div class="sub">${detail}</div>` : ""}${EQ.deleteMode ? "" : `<div style="margin-top:6px"><button class="btn secondary" style="padding:6px 10px;font-size:14px" onclick="event.stopPropagation(); go('parts', ${Number(e.id)})">🔧 Деталі (${Number(e.parts || 0)})</button></div>`}</div>${EQ.deleteMode ? "<span>✕</span>" : stBadge(e.status)}</div>`;
    }).join("");
    body = lineInfo +
      (edit ? (EQ.deleteMode ? `<p class="hint" style="color:#e0433a">Режим видалення: натисни на обладнання, яке треба прибрати зі списку.</p>` : `<p class="hint">Натисни на обладнання, щоб позначити ТО, ремонт чи повернення в роботу.</p>`) : "") +
      (items || `<div class="empty">На цій лінії обладнання ще немає</div>`) +
      (edit ? `<div class="form"><h2>Додати обладнання</h2>${formField("Назва обладнання", "eqname", "text", typed)}<div class="row"><button class="btn" onclick="eqAdd()">＋ Додати обладнання</button><button class="btn danger" onclick="eqToggleDelete()">${EQ.deleteMode ? "Готово" : "－ Видалити обладнання"}</button></div></div>` : "") +
      addLineForm +
      `<h2>Заплановані та історія</h2><div id="eqevents"><div class="center">Завантаження…</div></div>`;
  }

  render(
    topbar("🏭 Обладнання", "menu") +
    `<div class="form" style="margin-bottom:16px"><div class="row" style="flex-wrap:nowrap"><input type="search" id="partq" placeholder="🔍 Знайти деталь: номер, розмір, назва" style="flex:1" onkeydown="if(event.key==='Enter')partSearch()"><button class="btn" onclick="partSearch()">Знайти</button></div><div id="partresults"></div></div>` +
    `<div class="chips">${wsChips}</div>` +
    (lineChips ? `<div class="chips">${lineChips}</div>` : "") +
    warnLegend() +
    body
  );
}

function eqPickWorkshop(i) {
  const w = EQ.workshops[i];
  if (w === undefined) return;
  EQ.workshop = w;
  const inWs = EQ.lines.filter(l => l.workshop === w);
  EQ.lineId = inWs.length ? inWs[0].id : null;
  EQ.deleteMode = false;
  renderEquipment();
  loadEquipEvents();
}

function eqPickLine(id) {
  EQ.lineId = id;
  EQ.deleteMode = false;
  renderEquipment();
  loadEquipEvents();
}

function eqToggleDelete() {
  const typed = document.getElementById("eqname")?.value || "";
  EQ.deleteMode = !EQ.deleteMode;
  renderEquipment(typed);
  loadEquipEvents();
}

function eqClick(equipId) {
  if (!canEquip()) return;
  if (EQ.deleteMode) return eqDelete(equipId);
  eqMark(equipId);
}

async function eqStatusDialog(lineId, equipId, title, after) {
  const options = [["work", "Працює"], ["maintenance", "Планове ТО"], ["repair", "Ремонт обладнання"]];
  if (!equipId) options.push(["line_down", "Лінія не працює"]);
  const res = await askForm(title, [
    { id: "status", label: "Статус", type: "select", value: "maintenance", options: options.map(([value, label]) => ({ value, label })) },
    { id: "start", label: "Початок", type: "datetime-local", value: nowLocalInput() },
    { id: "end", label: "Закінчення (необов’язково)", type: "datetime-local", value: "" },
    { id: "note", label: "Примітка (необов’язково)", value: "", placeholder: "напр. заміна підшипника" },
  ]);
  if (!res) return;
  try {
    await api("/api/equipment/events", { method: "POST", body: {
      line_id: lineId, equipment_id: equipId || null, status: res.status,
      start: res.start, end: res.end, note: res.note.trim(),
    } });
    toast("Статус збережено");
    after();
  } catch (e) {
    toast(e.message);
  }
}

async function eqMark(equipId) {
  const line = curLine();
  if (!line || !canEquip()) return;
  const eq = equipId ? line.equipment.find(e => e.id === equipId) : null;
  return eqStatusDialog(line.id, equipId, eq ? eq.name : `${line.name} — уся лінія`, () => go("equipment", line.id));
}

async function eqAddLine() {
  const name = document.getElementById("linename").value.trim();
  if (!name) return toast("Введи назву лінії");
  try {
    const r = await api("/api/equipment/lines", { method: "POST", body: { workshop: EQ.workshop, name } });
    toast("Лінію додано");
    go("equipment", r.id);
  } catch (e) {
    toast(e.message);
  }
}

async function eqDeleteLine() {
  const line = curLine();
  if (!line) return;
  const n = line.equipment.length;
  if (!(await confirmDlg(`Видалити «${line.name}» (${EQ.workshop})? Разом із нею видалиться обладнання (${n}) та вся історія статусів.`))) return;
  try {
    await api("/api/equipment/lines/" + line.id, { method: "DELETE" });
    EQ.lineId = null;
    toast("Лінію видалено");
    go("equipment");
  } catch (e) {
    toast(e.message);
  }
}

async function eqAdd() {
  const name = document.getElementById("eqname").value.trim();
  if (!name) return toast("Введи назву обладнання");
  try {
    await api("/api/equipment", { method: "POST", body: { line_id: EQ.lineId, name } });
    go("equipment", EQ.lineId);
  } catch (e) {
    toast(e.message);
  }
}

async function eqDelete(equipId) {
  const line = curLine();
  const eq = line && line.equipment.find(e => e.id === equipId);
  if (!eq) return;
  if (!(await confirmDlg(`Видалити «${eq.name}» зі списку? Його історія статусів теж видалиться.`))) return;
  try {
    await api("/api/equipment/" + equipId, { method: "DELETE" });
    line.equipment = line.equipment.filter(e => e.id !== equipId);
    toast("Обладнання видалено");
    renderEquipment();
    loadEquipEvents();
  } catch (e) {
    toast(e.message);
  }
}

async function loadEquipEvents() {
  const box = document.getElementById("eqevents");
  if (!box || !EQ.lineId) return;
  const edit = canEquip();
  try {
    const rows = await api("/api/equipment/events?line_id=" + EQ.lineId);
    const stateLabel = { planned: "🕒 заплановано", active: "▶️ триває", finished: "✔️ завершено" };
    box.innerHTML = rows.length ? rows.map(r => `<div class="history ${r.state === "finished" ? "reverted" : ""}"><b>${esc(EQ_STATUS[r.status][0])}</b> · ${esc(r.target)} · ${stateLabel[r.state]}<br>${eqRange(r.from, r.until)}${r.note ? "<br>📝 " + esc(r.note) : ""}<br>👤 ${esc(r.username)}${edit ? `<br>${r.state === "active" ? `<button class="btn secondary" style="margin-top:6px" onclick="eqEndEvent(${Number(r.id)})">⏹ Завершити зараз</button> ` : ""}<button class="btn secondary" style="margin-top:6px" onclick="eqDeleteEvent(${Number(r.id)})">🗑 Видалити запис</button>` : ""}</div>`).join("") : `<div class="empty">Записів поки немає</div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty">Не вдалося завантажити: ${esc(e.message)}</div>`;
  }
}

async function eqEndEvent(id) {
  try {
    await api(`/api/equipment/events/${id}/end`, { method: "POST" });
    toast("Завершено");
    go("equipment", EQ.lineId);
  } catch (e) {
    toast(e.message);
  }
}

async function eqDeleteEvent(id) {
  if (!(await confirmDlg("Видалити цей запис зі статусів?"))) return;
  try {
    await api("/api/equipment/events/" + id, { method: "DELETE" });
    go("equipment", EQ.lineId);
  } catch (e) {
    toast(e.message);
  }
}

async function partSearch() {
  const q = (document.getElementById("partq")?.value || "").trim();
  const box = document.getElementById("partresults");
  if (!box) return;
  if (q.length < 2) { box.innerHTML = `<p class="hint">Введи хоча б 2 символи</p>`; return; }
  box.innerHTML = `<div class="center">Шукаю…</div>`;
  try {
    const rows = await api("/api/equipment/parts/search?q=" + enc(q));
    box.innerHTML = rows.length
      ? rows.map(r => `<div class="card click" onclick="go('parts', ${Number(r.equipment_id)})"><div class="card-main"><div class="title">${esc(r.equipment)}</div><div class="sub">${esc(r.workshop)} · ${esc(r.line)}<br><b>${esc(r.part)}:</b> <span style="white-space:pre-wrap">${esc(r.details)}</span></div></div><span>›</span></div>`).join("")
      : `<p class="hint">Нічого не знайдено серед заповнених деталей.</p>`;
  } catch (e) {
    box.innerHTML = `<p class="hint">Помилка пошуку: ${esc(e.message)}</p>`;
  }
}

// ================= ДЕТАЛІ ОБЛАДНАННЯ (бачать усі, змінює зав складу / адмін) =================
let PARTS = { eqId: null, data: null, deleteMode: false };

route("parts", async (eqId) => {
  PARTS.eqId = Number(eqId);
  PARTS.deleteMode = false;
  render(topbar("🔧 Деталі", "equipment") + `<div class="center">Завантаження…</div>`);
  PARTS.data = await api(`/api/equipment/${PARTS.eqId}/parts`);
  renderParts();
});

function renderParts(typedName = "", typedDetails = "") {
  const d = PARTS.data;
  const edit = canUsers();
  const st = d.status || { status: "work" };
  const statusBlock =
    `<div class="card"><div class="card-main"><div class="title">Поточний статус</div><div class="sub">${st.status !== "work" ? eqRange(st.from, st.until) + (st.source === "line" ? " (через лінію)" : "") + (st.note ? " · " + esc(st.note) : "") : "Без обмежень"}</div></div>${stBadge(st.status)}</div>` +
    `<div class="row" style="margin-bottom:10px">${canEquip() ? `<button class="btn" style="flex:1" onclick="partsChangeStatus()">⚙️ Змінити статус</button>` : ""}<button class="btn secondary" style="flex:1" onclick="showEquipQR(${Number(d.equipment.id)}, '${enc(d.equipment.name)}')">📱 QR-код</button></div>`;
  const usageBlock = `<h2>🛠 Списано на це обладнання (30 днів)</h2>` +
    ((d.usage || []).length
      ? d.usage.map(u => `<div class="card click" onclick="go('item', ${Number(u.item_id)})"><div class="card-main"><div class="title">${esc(u.name)}</div></div><span class="qty">${Number(u.qty)} ${uLabel(u.unit)}</span></div>`).join("")
      : `<div class="empty">Списань на це обладнання не було</div>`);
  const stateWord = { work: "Працює", maintenance: "Планове ТО", repair: "Ремонт обладнання", line_down: "Лінія не працює" };
  const eventsBlock = (d.events || []).length
    ? `<h2>Історія статусів</h2>` + d.events.map(e => `<div class="history"><b>${esc(stateWord[e.status] || e.status)}</b><br>${eqRange(e.from, e.until)}${e.note ? "<br>📝 " + esc(e.note) : ""}<br>👤 ${esc(e.username)}</div>`).join("")
    : "";
  const cards = d.parts.map((p, i) => {
    const body = p.details
      ? `<div class="sub" style="white-space:pre-wrap">${esc(p.details)}</div>`
      : `<div class="sub" style="opacity:.55">не заповнено${p.hint ? " · " + esc(p.hint) : ""}</div>`;
    return `<div class="card ${edit ? "click" : ""} ${PARTS.deleteMode ? "deleting" : ""}" ${edit ? `onclick="partClick(${i})"` : ""}><div class="card-main"><div class="title">${esc(p.name)}</div>${body}</div>${PARTS.deleteMode ? "<span>✕</span>" : ""}</div>`;
  }).join("");
  const form = edit
    ? `<div class="form"><h2>Додати деталь</h2>
        <label for="pname">Назва</label><input id="pname" list="partnames" value="${esc(typedName)}" placeholder="напр. Підшипники">
        <datalist id="partnames">${d.suggestions.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
        <label for="pdetails">Розмір / номер / опис</label><textarea id="pdetails">${esc(typedDetails)}</textarea>
        <div class="row"><button class="btn" onclick="partAdd()">＋ Додати деталь</button><button class="btn danger" onclick="partToggleDelete()">${PARTS.deleteMode ? "Готово" : "－ Видалити деталь"}</button></div>
        <div class="row" style="margin-top:8px"><button class="btn secondary" onclick="partTemplate()">📋 Стандартний набір</button><button class="btn secondary" onclick="partClearEmpty()">🧹 Прибрати порожні</button></div>
      </div>`
    : `<p class="hint">Змінювати деталі може зав складу.</p>`;
  render(
    topbar("🔧 " + d.equipment.name, "equipment") +
    `<p class="hint">${esc(d.equipment.workshop)} · ${esc(d.equipment.line)}</p>` +
    statusBlock + `<div id="qrholder"></div>` + usageBlock +
    `<h2>🔧 Деталі</h2>` +
    (edit && PARTS.deleteMode ? `<p class="hint" style="color:#e0433a">Режим видалення: натисни на деталь, яку треба прибрати.</p>` : (edit ? `<p class="hint">Натисни на деталь, щоб вписати або змінити розмір чи номер.</p>` : "")) +
    (cards || `<div class="empty">Деталей поки немає</div>`) +
    form + eventsBlock
  );
}

function partsChangeStatus() {
  const d = PARTS.data;
  eqStatusDialog(d.equipment.line_id, d.equipment.id, d.equipment.name, () => go("parts", PARTS.eqId));
}

function partClick(i) {
  const p = PARTS.data.parts[i];
  if (!p || !canUsers()) return;
  if (PARTS.deleteMode) return partDelete(p);
  partEdit(p);
}

async function partEdit(p) {
  const res = await askForm("Деталь", [
    { id: "name", label: "Назва", value: p.name },
    { id: "details", label: "Розмір / номер / опис", type: "textarea", value: p.details, placeholder: p.hint || "" },
  ]);
  if (!res) return;
  if (!res.name.trim()) return toast("Вкажи назву деталі");
  try {
    await api("/api/equipment/parts/" + p.id, { method: "POST", body: { name: res.name.trim(), details: res.details.trim() } });
    toast("Збережено");
    go("parts", PARTS.eqId);
  } catch (e) {
    toast(e.message);
  }
}

async function partAdd() {
  const name = document.getElementById("pname").value.trim();
  const details = document.getElementById("pdetails").value.trim();
  if (!name) return toast("Вкажи назву деталі");
  try {
    await api(`/api/equipment/${PARTS.eqId}/parts`, { method: "POST", body: { name, details } });
    go("parts", PARTS.eqId);
  } catch (e) {
    toast(e.message);
  }
}

function partToggleDelete() {
  const n = document.getElementById("pname")?.value || "";
  const d = document.getElementById("pdetails")?.value || "";
  PARTS.deleteMode = !PARTS.deleteMode;
  renderParts(n, d);
}

async function partDelete(p) {
  if (!(await confirmDlg(`Видалити деталь «${p.name}»?`))) return;
  try {
    await api("/api/equipment/parts/" + p.id, { method: "DELETE" });
    PARTS.data.parts = PARTS.data.parts.filter(x => x.id !== p.id);
    toast("Деталь видалено");
    renderParts();
  } catch (e) {
    toast(e.message);
  }
}

async function partTemplate() {
  try {
    const r = await api(`/api/equipment/${PARTS.eqId}/parts/template`, { method: "POST" });
    toast(r.added ? `Додано деталей: ${Number(r.added)}` : "Усі деталі набору вже є");
    go("parts", PARTS.eqId);
  } catch (e) {
    toast(e.message);
  }
}

async function partClearEmpty() {
  if (!(await confirmDlg("Видалити всі деталі, де нічого не вписано?"))) return;
  try {
    const r = await api(`/api/equipment/${PARTS.eqId}/parts/clear-empty`, { method: "POST" });
    toast(`Прибрано: ${Number(r.removed)}`);
    go("parts", PARTS.eqId);
  } catch (e) {
    toast(e.message);
  }
}

async function boot() {
  try {
    if (!tg || !initData) {
      throw new Error("Відкрий Mini App через Telegram, щоб передати дані авторизації.");
    }
    ME = await api("/api/me");
    if (ME.status === "removed") {
      render(topbar("Доступ закрито", null) + `<div class="center">Адміністратор закрив вам доступ до складу.</div>`);
      return;
    }
    if (!ME.profile_done) {
      renderProfile(true);
      return;
    }
    if (ME.status === "pending") {
      render(
        topbar("Очікування підтвердження", null) +
        `<div class="center">Ваш запит на доступ до складу надіслано адміністратору.<br><br>Після підтвердження закрийте та знову відкрийте застосунок.</div>`
      );
      return;
    }
    const page = new URLSearchParams(location.search).get("page");
    if (page === "deficit" || page === "equipment" || (page === "admin" && canUsers())) {
      await go(page);
      return;
    }
    await go("menu");
  } catch (e) {
    render(
      topbar("Не вдалося увійти", null) +
      `<div class="center">${esc(e.message)}<br><br><button class="btn" onclick="boot()">Спробувати ще раз</button></div>`
    );
  }
}

window.addEventListener("beforeunload", stopScanner);
boot();
</script>
</body>
</html>
